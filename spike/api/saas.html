/**
 * Moving a subject between officers. One function with two ways in: the button
 * beside the avatar for the common case (take it onto my own caseload), and the
 * officer dropdown for moving somebody to a third officer. Two entry points,
 * never two implementations.
 */
function wireTransfer(s) {
  const run = async (officer_id, name) => {
    const yes = await confirmModal({
      title: "Transfer supervision",
      body: `Move ${s.first_name} ${s.last_name} to ${name}'s caseload? They will appear `
          + `in ${name}'s app and drop off ${s.officer || "the current officer"}'s.`,
      confirmLabel: "Transfer", danger: false });
    if (!yes) return false;
    try {
      const r = await api("/api/subject/officer", { subject_id: s.subject_id, officer_id });
      toast(`Supervision transferred to ${r.officer}`);
      const j = SUBJECTS.findIndex(x => x.subject_id === s.subject_id);
      if (j >= 0) SUBJECTS[j] = { ...SUBJECTS[j], ...r.subject };
      route();
      return true;
    } catch (e) { toast(e.message, "err"); return false; }
  };

  const claim = el("claim");
  if (claim) claim.onclick = () => run(USER.officer_id, USER.name);

  const off = el("offSel");
  if (off) off.onchange = async () => {
    const ok = await run(Number(off.value), off.options[off.selectedIndex].text);
    // Put the control back to the truth if the transfer did not happen.
    if (!ok) off.value = OFFICERS.find(o => o.name === s.officer)?.id ?? "";
  };
}


/* ================================================================
   Reentry plan

   Twenty-one areas, each a group of checkpoints. The readiness figures at
   the top are never sent up and never stored — they arrive computed from
   the items, so the screen and any report are reading the same arithmetic.
================================================================ */
let RE = null;

const RE_AREA_LABEL = { ready: "Ready", in_progress: "In progress",
  needs_attention: "Needs attention", at_risk: "At risk",
  not_applicable: "Not applicable" };

/* Mirrors db/reentry.mjs. Duplicated deliberately and narrowly: the server
   is the authority — every figure shown comes from its readiness object —
   but the screen needs to know which of two signatures is missing to label
   a row, and a round trip per row to ask would be absurd. */
const reDone = i => i.status === "exception" ||
  (i.status === "ready" && i.officer_signed_at && i.subject_signed_at);

async function renderReentry(s) {
  view.innerHTML = `<div class="crumb"><a id="toRoster">Subjects</a> &nbsp;&rsaquo;&nbsp;
    <a id="toProfile">${esc(s.name)}</a> &nbsp;&rsaquo;&nbsp; Reentry Plan</div>
    <p class="pagesub">Loading…</p>`;
  el("toRoster").onclick = () => { location.hash = "/subjects"; };
  el("toProfile").onclick = () => { location.hash = `/subject/${s.subject_id}`; };

  RE = await fetch(`/api/reentry?subject_id=${encodeURIComponent(s.subject_id)}`)
    .then(r => r.json()).catch(() => null);
  paintReentry(s);
}

function paintReentry(s) {
  if (!RE) {
    view.innerHTML += `<div class="err">Couldn't load the reentry plan.</div>`;
    return;
  }
  const p = RE.plan;

  if (!p) {
    view.innerHTML = view.innerHTML.replace(/<p class="pagesub">.*?<\/p>/,
      `<div class="panel empty">
         <h2>No reentry plan yet</h2>
         <p>Creating one stamps the standard ${RE.areas.length}-area template onto this
            case. The checkpoints are fixed so that one plan can be compared with
            another; what changes case to case is their status.</p>
         <button class="btn" id="re_create">Create reentry plan</button>
       </div>`);
    el("re_create").onclick = async e => {
      e.currentTarget.disabled = true;
      try {
        await api("/api/reentry/create",
          { subject_id: s.subject_id, officer_name: s.officer });
        toast("Reentry plan created");
        renderReentry(s);
      } catch (err) { toast(err.message, "err"); e.currentTarget.disabled = false; }
    };
    return;
  }

  const r = p.readiness;
  const byArea = k => p.items.filter(i => i.area === k);

  view.innerHTML = `
    <div class="crumb"><a id="toRoster">Subjects</a> &nbsp;&rsaquo;&nbsp;
      <a id="toProfile">${esc(s.name)}</a> &nbsp;&rsaquo;&nbsp; Reentry Plan</div>

    <div class="panel reHead">
      <div class="reScore">
        <div class="reDial" style="--pct:${r.percent}">
          <span>${r.percent}<i>%</i></span>
        </div>
        <div class="reGate ${p.certified_at ? "done" : r.ready_for_reentry ? "on" : ""}">
          ${p.certified_at ? "Certified complete"
            : r.ready_for_reentry ? "Ready for reentry" : "Not ready for reentry"}
        </div>
      </div>
      <div class="reFacts">
        <div><dt>Checkpoints</dt><dd>${r.complete} of ${r.total} complete</dd></div>
        <div><dt>Critical items</dt>
             <dd class="${r.critical_complete === r.critical_total ? "good" : "warn"}">
               ${r.critical_complete} of ${r.critical_total} complete</dd></div>
        <div><dt>Awaiting signature</dt><dd>${r.awaiting_signature}</dd></div>
        <div><dt>Not applicable</dt><dd>${r.not_applicable}</dd></div>
        <div><dt>Target release</dt>
             <dd>${esc(longDate(p.target_release_date)) || "—"}</dd></div>
        <div><dt>Status</dt><dd>
          <span class="badge">${p.status === "active" ? "Issued" : "Draft"}</span></dd></div>
      </div>
      <div class="reActs">
        ${p.officer_signed_at
          ? `<span class="mine">Issued by ${esc(p.officer_signed_by || "the officer")}</span>`
          : `<button class="btn small" id="re_sign">Sign as officer</button>`}
        ${p.officer_signed_at && p.status !== "active"
          ? `<button class="btn small" id="re_issue">Issue to subject</button>` : ""}
        <button class="btn small ghost" id="re_edit" data-tip="Target release date, facility, notes">Plan details</button>
        <button class="btn small ghost" id="re_pdf" data-tip="Render the plan as a PDF and file it">PDF</button>
        <button class="btn small ghost" id="re_hist" data-tip="Every change to this plan, newest first">History</button>
        ${p.certified_at
          ? `<span class="reCertDone">&#10003; Certified complete</span>`
          : p.status === "active" ? `
          <button class="btn small certify" id="re_cert" ${r.certifiable && p.subject_signed_at ? "" : "disabled"}
                  data-tip="${r.certifiable && p.subject_signed_at
                    ? "Sign off the completed plan"
                    : !p.subject_signed_at
                      ? "The subject has not accepted this plan yet"
                      : `${r.outstanding} checkpoint${r.outstanding === 1 ? "" : "s"} still outstanding`}">
            Certify complete
          </button>` : ""}
      </div>
      ${p.certified_at
        ? `<div class="reAccepted certified">Certified complete by
             ${esc(p.certified_by || "the supervising officer")} on
             ${esc(whenFull(p.certified_at))}. Every checkpoint is done.</div>`
        : p.subject_signed_at
        ? `<div class="reAccepted">Accepted by ${esc(s.name)} on
             ${esc(whenFull(p.subject_signed_at))} — this is the plan they agreed to,
             not a finished one. ${r.outstanding
               ? `${r.outstanding} checkpoint${r.outstanding === 1 ? "" : "s"} to go
                  before you can certify it.`
               : "Everything is done; it is ready for you to certify."}</div>`
        : p.status === "active"
          ? `<div class="reAccepted pending">Issued — waiting for ${esc(s.first_name)}
               to accept it in the app.</div>`
          : `<div class="reAccepted pending">Draft. The subject sees nothing until it
               is signed and issued.</div>`}
    </div>

    ${RE.areas.map(([key, title, desc]) => {
      const items = byArea(key);
      if (!items.length) return "";
      const st = reAreaStatus(items);
      return `
      <div class="panel reArea">
        <div class="reAreaHead">
          <div>
            <h2>${esc(title)}</h2>
            <p class="reDesc">${esc(desc)}</p>
          </div>
          <span class="reStat ${st}">${RE_AREA_LABEL[st]}</span>
        </div>
        <div class="reItems">
          ${items.map(i => reItemRow(i, s)).join("")}
        </div>
      </div>`;
    }).join("")}`;

  el("toRoster").onclick = () => { location.hash = "/subjects"; };
  el("toProfile").onclick = () => { location.hash = `/subject/${s.subject_id}`; };
  wireReentry(s, p);
}

/* Same rule as the server's areaStatus, and the only place the client
   reimplements it — an area heading cannot wait for a round trip. */
function reAreaStatus(items) {
  const live = items.filter(i => i.status !== "not_applicable");
  if (!live.length) return "not_applicable";
  if (live.every(reDone)) return "ready";
  const unmet = live.filter(i => !reDone(i));
  if (unmet.some(i => i.critical && i.status === "not_started")) return "at_risk";
  if (unmet.some(i => i.status === "in_progress" || i.status === "ready"))
    return "in_progress";
  return "needs_attention";
}

function reItemRow(i, s) {
  const done = reDone(i);
  const waiting = i.status === "ready" && !done;
  const who = i.officer_signed_at ? "the subject" : "the officer";
  return `
    <div class="reItem ${done ? "done" : ""} ${i.status}">
      <div class="reTick ${done ? "on" : ""}">${done ? "&#10003;" : ""}</div>
      <div class="reBody">
        <div class="reLabel">
          ${esc(i.label)}
          ${i.critical ? `<span class="reCrit" data-tip="A critical requirement — this one gates release">critical</span>` : ""}
        </div>
        ${i.detail ? `<div class="reDetail">${esc(i.detail)}</div>` : ""}
        ${i.status === "exception" ? `
          <div class="reMit"><b>Exception</b> — ${esc(i.mitigation)}
            <span class="reBy">approved by ${esc(i.approved_by)}</span></div>` : ""}
        ${waiting ? `<div class="reWait">Awaiting signature from ${who}</div>` : ""}
        ${done && i.officer_signed_at ? `
          <div class="reSigned">Signed off by ${esc(i.officer_signed_by || "the officer")}
            and ${esc(s.first_name)}</div>` : ""}
      </div>
      <div class="reCtl">
        <select class="reSel" data-item="${i.id}">
          ${RE.statuses.map(([k, lbl]) =>
            `<option value="${k}"${k === i.status ? " selected" : ""}>${esc(lbl)}</option>`).join("")}
        </select>
        ${i.status === "ready" && !i.officer_signed_at
          ? `<button class="btn small" data-sign="${i.id}">Sign off</button>` : ""}
        <button class="btn small ghost icon" data-edit="${i.id}"
                data-tip="Record the address, provider or appointment">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
    </div>`;
}

function wireReentry(s, p) {
  const reload = async () => {
    RE = await fetch(`/api/reentry?subject_id=${encodeURIComponent(s.subject_id)}`)
      .then(r => r.json());
    paintReentry(s);
  };

  if (el("re_sign")) el("re_sign").onclick = async e => {
    e.currentTarget.disabled = true;
    try { await api("/api/reentry/sign", { id: p.id }); toast("Plan signed"); reload(); }
    catch (err) { toast(err.message, "err"); e.currentTarget.disabled = false; }
  };

  if (el("re_issue")) el("re_issue").onclick = async () => {
    const yes = await confirmModal({
      title: "Issue this plan?",
      body: `${s.first_name} will see the plan in their app and be asked to accept it. `
          + `Each checkpoint then needs both your signature and theirs.`,
      confirmLabel: "Issue", danger: false });
    if (!yes) return;
    try { await api("/api/reentry/save", { id: p.id, status: "active" });
          toast("Plan issued"); reload(); }
    catch (err) { toast(err.message, "err"); }
  };

  el("re_pdf").onclick = async e => {
    e.currentTarget.disabled = true;
    try { await api("/api/reentry/pdf", { id: p.id }); toast("PDF filed against the case"); }
    catch (err) { toast(err.message, "err"); }
    finally { e.currentTarget.disabled = false; }
  };

  if (el("re_cert")) el("re_cert").onclick = async () => {
    const yes = await confirmModal({
      title: "Certify this plan complete?",
      body: `You are signing off that every checkpoint on ${s.first_name}'s reentry `
          + `plan is done. Reopening any checkpoint afterwards withdraws the `
          + `certification.`,
      confirmLabel: "Certify complete", danger: false });
    if (!yes) return;
    try { await api("/api/reentry/certify", { id: p.id });
          toast("Plan certified complete"); reload(); }
    catch (err) { toast(err.message, "err"); }
  };

  el("re_edit").onclick = () => reDetailsModal(s, p, reload);
  el("re_hist").onclick = () => reHistoryModal(p);

  /* Changing a status reopens the checkpoint, so say so before doing it —
     it discards signatures that were already given. */
  view.querySelectorAll(".reSel").forEach(sel => {
    sel.onchange = async () => {
      const id = Number(sel.dataset.item);
      const item = p.items.find(x => x.id === id);
      const next = sel.value;

      if (next === "exception") return reExceptionModal(item, reload, () => paintReentry(s));

      if ((item.officer_signed_at || item.subject_signed_at) && next !== item.status) {
        const yes = await confirmModal({
          title: "Reopen this checkpoint?",
          body: `"${item.label}" has been signed off. Changing its status clears both `
              + `signatures, and it will need signing again by you and by ${s.first_name}.`,
          confirmLabel: "Reopen" });
        if (!yes) return paintReentry(s);
      }
      try { const d = await api("/api/reentry/item", { id, status: next });
            toast(d.uncertified
              ? `${item.label} reopened — the plan is no longer certified`
              : `${item.label} — ${RE.statuses.find(x => x[0] === next)[1]}`);
            reload(); }
      catch (err) { toast(err.message, "err"); paintReentry(s); }
    };
  });

  view.querySelectorAll("[data-sign]").forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.sign);
    const item = p.items.find(x => x.id === id);
    b.disabled = true;
    try {
      const d = await api("/api/reentry/item/sign", { id });
      toast(d.complete ? `${item.label} — complete`
                       : `Signed. Waiting for ${s.first_name} to sign it too.`);
      reload();
    } catch (err) { toast(err.message, "err"); b.disabled = false; }
  });

  view.querySelectorAll("[data-edit]").forEach(b => b.onclick = () =>
    reDetailModal(p.items.find(x => x.id === Number(b.dataset.edit)), reload));
}

/* A modal footer, the same shape the rest of the console uses. */
const reFoot = (label, id) => `
  <div class="mactions" style="margin-top:14px">
    <button class="btn small ghost" onclick="closeModal()">Cancel</button>
    <button class="btn small" id="${id}">${label}</button>
  </div>`;

/* What makes a checkpoint real: the address, the provider, the appointment. */
function reDetailModal(item, reload) {
  showModal(item.label, "What was arranged, so the record says more than a tick.", `
    <label for="re_d">Detail</label>
    <textarea id="re_d" rows="3" placeholder="e.g. Dr Halloran, Kingsport Family Medicine — first appointment 14 Oct, 9:00">${esc(item.detail || "")}</textarea>
    ${reFoot("Save detail", "re_dsave")}`);
  el("re_dsave").onclick = async e => {
    e.currentTarget.disabled = true;
    try {
      await api("/api/reentry/item", { id: item.id, detail: el("re_d").value.trim() });
      toast(`${item.label} — detail saved`);
      closeModal(); reload();
    } catch (err) { toast(err.message, "err"); e.currentTarget.disabled = false; }
  };
}

/* An exception is the documented answer to "this cannot be completed". Both
   halves are required by the server; ask for them properly rather than
   letting the officer discover that in an error toast. */
function reExceptionModal(item, reload, cancel) {
  showModal(`Exception — ${item.label}`,
    "Not complete must never automatically mean cannot release. Record what is "
    + "being done instead, and who approved it.", `
    <label for="re_m">Mitigation plan</label>
    <textarea id="re_m" rows="3" placeholder="e.g. DMV appointment booked for the week after release; temporary ID issued by the facility.">${esc(item.mitigation || "")}</textarea>
    <label for="re_a">Approved by</label>
    <input type="text" id="re_a" value="${esc(item.approved_by || "")}" placeholder="Name of the approving supervisor">
    ${reFoot("Approve exception", "re_xsave")}`);

  // Closing without approving must put the dropdown back to the truth.
  const wrap = el("modal");
  if (wrap) wrap.addEventListener("click", e => {
    if (e.target.classList.contains("scrim") || e.target.classList.contains("mclose")) cancel();
  });
  wrap?.querySelector(".mactions .ghost")?.addEventListener("click", cancel);

  el("re_xsave").onclick = async e => {
    const mitigation = el("re_m").value.trim(), approved_by = el("re_a").value.trim();
    if (!mitigation) return toast("A mitigation plan is required.", "err");
    if (!approved_by) return toast("Name whoever approved the exception.", "err");
    e.currentTarget.disabled = true;
    try {
      await api("/api/reentry/item",
        { id: item.id, status: "exception", mitigation, approved_by });
      toast(`${item.label} — exception approved`);
      closeModal(); reload();
    } catch (err) { toast(err.message, "err"); e.currentTarget.disabled = false; }
  };
}

function reDetailsModal(s, p, reload) {
  showModal("Plan details", "Amending these withdraws the subject's acceptance.", `
    <div class="frow">
      <div><label for="re_t">Target release date</label>
        <input type="date" id="re_t" value="${esc((p.target_release_date || "").slice(0, 10))}"></div>
      <div><label for="re_f">Facility</label>
        <input type="text" id="re_f" value="${esc(p.facility || "")}"></div>
    </div>
    <label for="re_n">Notes</label>
    <textarea id="re_n" rows="3">${esc(p.notes || "")}</textarea>
    ${reFoot("Save plan details", "re_psave")}`);
  el("re_psave").onclick = async e => {
    e.currentTarget.disabled = true;
    try {
      const d = await api("/api/reentry/save", { id: p.id,
        target_release_date: el("re_t").value || null,
        facility: el("re_f").value.trim() || null,
        notes: el("re_n").value.trim() || null });
      toast(d.amended
        ? "Plan details saved — the subject's acceptance was withdrawn"
        : "Plan details saved");
      closeModal(); reload();
    } catch (err) { toast(err.message, "err"); e.currentTarget.disabled = false; }
  };
}

async function reHistoryModal(p) {
  let events = [];
  try { events = (await fetch(`/api/reentry/history?plan_id=${p.id}`)
          .then(r => r.json())).events || []; }
  catch { return toast("Couldn't load the history", "err"); }

  const label = Object.fromEntries(RE.statuses);
  showModal("Plan history",
    "Every change, newest first. Append-only — nothing here can be edited.", `
    <div class="cnList">
      ${events.length ? events.map(e => `
        <div class="cnItem">
          <div class="cnMeta">${esc(whenFull(e.created_at))}
            ${e.author ? ` · ${esc(e.author)}` : ""}
            ${e.actor_role ? ` <span class="reBy">${esc(e.actor_role)}</span>` : ""}</div>
          <div class="cnBody">${
            e.kind === "status"
              ? `${esc(itemLabel(p, e.item_id))} — ${esc(label[e.from_status] || e.from_status || "new")}
                 &rarr; ${esc(label[e.to_status] || e.to_status)}`
              : e.item_id
                ? `${esc(itemLabel(p, e.item_id))} — ${esc(e.body || "")}`
                : esc(e.body || "")}</div>
        </div>`).join("") : `<p class="muted">Nothing recorded yet.</p>`}
    </div>`);
}

const itemLabel = (p, id) =>
  p.items.find(i => i.id === id)?.label || "checkpoint";

/* Every acknowledgment the subject has given, with the text each referred to. */
async function paintAckHistory(a, subj) {
  const box = el("ackHistory"); if (!box || !a?.id) return;
  let list = [];
  try {
    const d = await fetch(`/api/agreement/acknowledgments?agreement_id=${a.id}`).then(r => r.json());
    list = d.acknowledgments || [];
  } catch { return; }
  if (list.length < 1) return;

  box.innerHTML = `
    <div class="ackHist">
      <div class="ackHistTop">Acknowledgment history</div>
      ${list.map((x, i) => `
        <div class="ackHistRow">
          <span class="ackHistWhen">${esc(whenFull(x.acknowledged_at))}</span>
          ${i === 0 && !a.subject_signed_at
            ? `<span class="ackHistTag">withdrawn by amendment</span>` : ""}
          <button class="linkbtn" data-ack="${x.id}">View what was accepted</button>
        </div>`).join("")}
    </div>`;

  box.querySelectorAll("[data-ack]").forEach(b => b.onclick = async () => {
    try {
      const d = await fetch(`/api/agreement/acknowledgment?id=${b.dataset.ack}`).then(r => r.json());
      showModal("Accepted text",
        `Exactly as it read when ${esc(subj.name)} accepted it on `
        + `${esc(whenFull(d.acknowledgment.acknowledged_at))}.`,
        `<pre class="snapshot">${esc(d.acknowledgment.snapshot)}</pre>`);
    } catch { toast("Couldn't load that acknowledgment", "err"); }
  });
}

/* ---------------- Waypoint login ----------------
   A login belongs to the subject, not to any program they were given. It is
   created once, deliberately, and survives every assignment after it. */
function paintLoginRow(s) {
  const row = el("loginRow"); if (!row) return;
  row.innerHTML = s.has_login ? `
    <div class="lbl"><b>Waypoint login active</b> &mdash; ${esc(s.login || s.subject_id + "@example.com")}</div>
    <button class="btn small ghost" id="lg_reset">Reset password</button>` : `
    <div class="lbl">No Waypoint login. ${esc(s.name.split(" ")[0])} cannot sign in to the
      app or the learner site until one is created.</div>
    <button class="btn small" id="lg_create">Create Waypoint Login</button>`;

  const go = async (reset, btn) => {
    btn.disabled = true;
    btn.textContent = reset ? "Resetting\u2026" : "Creating\u2026";
    try {
      const d = await api("/api/subject/login", { subject_id: s.subject_id, reset });
      s.has_login = true;
      s.login = d.credentials.login;
      showCreds(s.name, d.credentials);
      paintLoginRow(s);
      // The ring is on the roster too, so that copy has to learn about it.
      const inList = SUBJECTS.find(x => x.subject_id === s.subject_id);
      if (inList) { inList.has_login = true; inList.login = d.credentials.login; }
      const av = document.querySelector(".profhead .avatar");
      if (av) av.classList.add("hasLogin");
      toast(reset ? "Password reset" : "Login created");
    } catch (e) {
      btn.disabled = false;
      btn.textContent = reset ? "Reset password" : "Create Waypoint Login";
      toast(String(e.message || e), "err");
    }
  };

  if (el("lg_create")) el("lg_create").onclick = e => go(false, e.currentTarget);
  if (el("lg_reset")) el("lg_reset").onclick = async e => {
    const btn = e.currentTarget;
    const yes = await confirmModal({
      title: `Reset ${s.name}'s password?`,
      body: "Their current password stops working immediately, and the new one is shown "
          + "only once. If they are mid-course they will be signed out.",
      confirmLabel: "Reset password"
    });
    if (yes) go(true, btn);
  };
}

async function loadDetail(s) {
  try {
    const [d1, d2] = await Promise.all([
      fetch(`/api/subject/detail?subject_id=${encodeURIComponent(s.subject_id)}`).then(r => r.json()),
      fetch(`/api/documents?subject_id=${encodeURIComponent(s.subject_id)}`).then(r => r.json())
    ]);
    DETAIL = { ...d1, documents: d2.documents || [] };
  } catch { DETAIL = { vehicles: [], curfew: null, community_service: [],
                       documents: [], goals: [], programs: [] }; }
  renderTiles(s);
}

function renderTiles(s) {
  const box = el("tiles"); if (!box) return;
  const v = DETAIL?.vehicles || [];
  const c = DETAIL?.curfew;
  const cs = DETAIL?.community_service || [];
  const tp = DETAIL?.travel_permit;
  const emp = DETAIL?.employment;
  const kin = DETAIL?.contacts || [];
  const docs = DETAIL?.documents || [];

  const done = cs.filter(o => o.status === "complete").length;
  const hours = cs.reduce((a, o) => a + (Number(o.required_quantity) || 0), 0);

  const tile = (key, label, summary, count) => `
    <button class="tile" data-tile="${key}">
      <span class="ticon">${ICON[key]}</span>
      <span class="tbody">
        <span class="tlabel">${label}</span>
        <span class="tsum">${summary}</span>
      </span>
      ${count ? `<span class="tcount">${count}</span>` : ""}
    </button>`;

  box.innerHTML =
      tile("vehicle", "Vehicles",
           v.length ? v.map(x => [x.year, x.make, x.model].filter(Boolean).join(" ")).join(", ")
                    : "None on record", v.length)
    + tile("curfew", "Curfew",
           c?.active ? `${esc(c.start_time)} – ${esc(c.end_time)}` : "No curfew", "")
    + tile("contacts", "Family & Contacts",
           kin.length
             ? kin.slice(0, 2).map(c => `${c.name} (${c.relationship})`).join(", ")
               + (kin.length > 2 ? ` +${kin.length - 2} more` : "")
             : "None on record", kin.length)
    + tile("employ", "Employment",
           (!emp || emp.status === "not_employed" ? "Not employed"
              : emp.status === "self_employed" ? "Self-employed"
              : emp.company_name || "Employed")
           + (emp?.updated_by === "subject" ? " &middot; reported by subject" : ""),
           emp && emp.status !== "not_employed" ? 1 : "")
    + tile("travel", "Travel Permit",
           !tp || tp.level === "none" ? "None permitted"
             : isExpired(tp) ? `${travelLabel(tp.level)} — expired ${asDate(tp.expires_on)}`
             : `${travelLabel(tp.level)}${tp.expires_on ? ` until ${asDate(tp.expires_on)}` : ""}`, "")
    + tile("docs", "Documents",
           docs.length ? `${docs.length} on file · latest ${asDate((docs[0].created_at || "").slice(0,10))}`
                       : "None on file", docs.length)
    + (() => {
        const f = DETAIL?.financial?.totals;
        return tile("financial", "Financial Balance",
          !f || !f.owed_cents ? "Nothing owed"
            : `${money(f.balance_cents)} due`
              + (f.overdue_cents ? ` · ${money(f.overdue_cents)} overdue` : "")
              + (f.balance_cents === 0 ? " · settled" : ""),
          f?.open_count || "");
      })()
    + (() => {
        const dsum = DETAIL?.important_dates?.summary;
        const ds = DETAIL?.important_dates?.dates || [];
        return tile("dates", "Important Dates",
          !ds.length ? "None scheduled"
            : !dsum.n ? `${ds.length} closed`
            : (dsum.next ? `Next ${whenFull(dsum.next)}` : `${dsum.n} scheduled`)
              + (dsum.unaccepted ? ` · ${dsum.unaccepted} not accepted` : "")
              + (dsum.awaiting_outcome ? ` · ${dsum.awaiting_outcome} unreported` : ""),
          dsum?.n || "");
      })()
    + tile("service", "Community Service",
           cs.length ? `${done}/${cs.length} complete · ${hours} hrs` : "None assigned", cs.length);

  box.querySelectorAll("[data-tile]").forEach(b =>
    b.onclick = () => openModal(b.dataset.tile, s));

  paintGoalCount();
  paintProgramCount();
  paintVisitCount();
  paintProfileCounts();

  if (window.__savedTile) {
    const t = box.querySelector(`[data-tile="${window.__savedTile}"]`);
    window.__savedTile = null;
    if (t) { t.classList.add("saved"); setTimeout(() => t.classList.remove("saved"), 1400); }
  }
}

function paintProfileCounts() {
  const agreement = DETAIL?.agreement;
  paintCount("agreementCount", {
    n: agreement ? 1 : 0,
    urgent: agreement?.status === "draft",
    tip: agreement ? `Agreement ${agreement.status}` : "No agreement"
  });
}

/* ---------------- visits ---------------- */
function renderVisits(s) {
  view.innerHTML = `
    <div class="crumb">
      <a id="toRoster">Subjects</a> &nbsp;&rsaquo;&nbsp;
      <a id="toProfile">${esc(s.name)}</a> &nbsp;&rsaquo;&nbsp; Visits
    </div>

    <section class="panel">
      <div class="panelHead">
        <h2>Visits</h2>
        <button class="btn small" id="addVisit">Add Visit</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>When</th><th>Officer</th><th>Status</th><th></th></tr></thead>
          <tbody id="vlist"><tr><td colspan="4" class="empty">No visits scheduled.</td></tr></tbody>
        </table>
      </div>
      <div class="foot">Subject Requested &rarr; Scheduled &rarr; Viewed &rarr; Accepted &rarr; Complete</div>
    </section>`;

  el("toRoster").onclick = () => { location.hash = "/subjects"; };
  el("toProfile").onclick = () => { location.hash = `/subject/${s.subject_id}`; };
  el("addVisit").onclick = () => addVisitModal(s);

  loadVisits(s);
  poll = setInterval(() => loadVisits(s), 3000);
}

/**
 * Scheduling a visit, in a modal.
 *
 * It used to be a panel occupying half the screen whether or not anybody was
 * scheduling anything, which pushed the list of actual visits — the thing an
 * officer opens this screen to read — into a column beside it. A form is
 * something you reach for; a list is something you look at.
 */
function addVisitModal(s, existing) {
  // 10am, three days out: a sensible starting point to edit, not a guess to fix.
  const d = existing?.scheduled_at ? new Date(existing.scheduled_at)
                                   : new Date(Date.now() + 3 * 864e5);
  if (!existing) d.setHours(10, 0, 0, 0);
  const localValue = new Date(d.getTime() - d.getTimezoneOffset() * 60000)
                       .toISOString().slice(0, 16);
  const addr = existing?.location || oneLineAddress(s);

  showModal(existing ? "Edit Visit" : "Add Visit", `${s.name} — ${s.case_number}`, `
    <p class="hint">The subject sees this in their app immediately, and it stays
       flagged for them until they confirm it.</p>

    <div class="frow">
      <div><label for="when">Date and time</label>
        <input type="datetime-local" id="when" value="${localValue}"></div>
      <div><label for="officer">Officer</label>
        <input type="text" id="officer" value="${esc(existing?.officer || s.officer)}"></div>
    </div>

    <!-- A home visit is a day, not an hour. Saying so lets the route planner
         order the day around whatever genuinely is fixed, and stops the
         subject being shown a time nobody promised. -->
    <label class="check">
      <input type="checkbox" id="firm" ${existing?.time_fixed ? "checked" : ""}>
      <span>This time is firm &mdash; a hearing, an office appointment</span>
    </label>
    <p class="mnote" id="firmNote"></p>

    <label for="place">Location</label>
    <input type="text" id="place" value="${esc(addr)}">
    ${addressBlock(addr, { label: "Check it on a map" })}

    <label for="notes">Notes <span style="font-weight:400;color:var(--faint)">(optional)</span></label>
    <input type="text" id="notes" value="${esc(existing?.notes || "")}"
           placeholder="e.g. bring proof of employment">

    ${existing?.accepted_at ? `<p class="mnote">${esc(s.first_name)} has confirmed
      this visit. Changing the time or the place withdraws that, and they will
      be asked to confirm again.</p>` : ""}

    ${existing ? "" : `<h4 class="vdHead" style="margin-top:20px">Agenda</h4>`}
    <p class="hint">What is outstanding right now. These are attached to the visit
       when you schedule it, and stay on its record afterwards.</p>
    ${existing ? "" : `<div id="agPreview" class="mempty">Loading&hellip;</div>`}

    ${reFoot(existing ? "Save changes" : "Schedule visit", "book")}`);

  /* Shown before the visit exists, so the officer can see what it is for while
     they are still picking a date. An existing visit already has an agenda of
     its own, on its detail screen — showing a preview beside it would be two
     answers to one question. */
  if (!existing) fetch(`/api/visits/agenda/preview?subject_id=${encodeURIComponent(s.subject_id)}`)
    .then(r => r.json()).then(d => {
      const box = el("agPreview"); if (!box) return;
      const items = d.items || [];
      box.className = "";
      box.innerHTML = items.length
        ? `<div class="agendaList">${items.map(agPreviewRow).join("")}</div>`
        : `<p class="muted">Nothing outstanding — this visit starts with a clear agenda.</p>`;
    }).catch(() => {
      const box = el("agPreview"); if (!box) return;
      box.className = "";
      box.innerHTML = `<p class="muted">Couldn't load the agenda; the visit can still
        be scheduled and you can refresh it afterwards.</p>`;
    });

  const firmNote = () => {
    el("firmNote").textContent = el("firm").checked
      ? "The subject sees the time, and the route planner keeps this slot."
      : "The subject sees the day, not an hour, and the route planner is free "
      + "to fit this visit wherever it saves driving.";
  };
  el("firm").onchange = firmNote;
  firmNote();

  el("book").onclick = async e => {
    const btn = e.currentTarget, label = btn.textContent;
    const whenVal = el("when").value;
    if (!whenVal) return toast("Pick a date and time.", "err");
    btn.disabled = true; btn.textContent = "Saving\u2026";
    try {
      const d = await api("/api/visits", {
        id: existing?.id,
        subject_id: s.subject_id,
        scheduled_at: new Date(whenVal).toISOString(),
        officer: el("officer").value, location: el("place").value,
        time_fixed: el("firm").checked,
        notes: el("notes").value || null });
      /* Say what changed, and say when it cost a confirmation — an officer
         who moves a visit needs to know the subject has to agree again. */
      toast(d.reconfirm
        ? `Visit moved to ${whenFull(new Date(whenVal).toISOString())} — `
          + `${s.first_name} must confirm again`
        : existing
          ? `Visit saved for ${whenFull(new Date(whenVal).toISOString())}`
          : `Visit scheduled for ${whenFull(new Date(whenVal).toISOString())}`);
      closeModal();
      loadVisits(s);
    } catch (err) {
      toast(String(err.message || err), "err");
      btn.disabled = false; btn.textContent = label;
    }
  };
}

/** mm:ss. A recording is minutes long, so "4:07" reads better than "4m 7s". */
const clockMs = ms => {
  const t = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
};

/* 8/31/2026, 11:00 AM */
const whenFull = t => t ? new Date(t).toLocaleString(undefined,
  { month:"numeric", day:"numeric", year:"numeric",
    hour:"numeric", minute:"2-digit" }) : "—";

async function loadVisits(s) {
  try {
    const d = await fetch(`/api/visits?subject_id=${encodeURIComponent(s.subject_id)}`)
      .then(r => r.json());
    const rows = (d.visits || []).filter(v => v.status !== "cancelled");
    /* Held so a row's Edit can open the visit it is on. The alternative is
       stuffing every field into data- attributes, which is a second copy of
       the record living in the DOM. */
    VISITS = rows;
    const body = el("vlist"); if (!body) return;

    /* A poll that redraws the table mid-edit destroys the input the officer
       is using and slams the native date picker shut. Skip this cycle while
       anything in here has focus. */
    const active = document.activeElement;
    if (active && body.contains(active) && /INPUT|SELECT|TEXTAREA/.test(active.tagName)) return;

    /* Anything already typed but not yet submitted survives the redraw. */
    const typed = {};
    body.querySelectorAll("input[id^='rq-']").forEach(i => { typed[i.id] = i.value; });

    // Default for a request the officer is about to schedule.
    const d3 = new Date(Date.now() + 3 * 864e5); d3.setHours(10, 0, 0, 0);
    const defaultWhen = new Date(d3.getTime() - d3.getTimezoneOffset() * 60000)
                          .toISOString().slice(0, 16);

    body.innerHTML = rows.length ? rows.map(v => {
      const requested = v.status === "requested";
      const done = v.status === "completed";
      const accepted = !!v.accepted_at;

      /* Subject Requested → Scheduled → Viewed → Accepted → Complete */
      const stage = requested ? { cls: "amber", label: "Subject Requested", at: v.requested_at }
                  : done      ? { cls: "ok",    label: "Complete",  at: v.completed_at }
                  : accepted  ? { cls: "ok",    label: "Accepted",  at: v.accepted_at }
                  : v.seen_at ? { cls: "go",    label: "Viewed",    at: v.seen_at }
                  :             { cls: "muted", label: "Scheduled", at: v.created_at };

      /* A request has no date yet, so the officer sets one right here.
         The reason sits behind an info icon rather than filling the row. */
      const whenCell = requested
        ? `<div class="whenedit">
             <input type="datetime-local" id="rq-${v.id}" value="${defaultWhen}">
             ${v.request_note
               ? `<button class="info" tabindex="0"
                    aria-label="Reason given by the subject"
                    data-tip="${esc(v.request_note)}">i</button>`
               : ""}
           </div>`
        : `<div class="cellMain">${esc(whenFull(v.scheduled_at))}</div>
           ${v.location ? `<div class="cellSub">${addressBlock(v.location)}</div>` : ""}
           ${v.notes ? `<div class="cellSub">${esc(v.notes)}</div>` : ""}
           ${(() => {
              const n = noteCount(v), ph = (v.photos || []).length;
              const bits = [];
              if (n) bits.push(`${n} note${n === 1 ? "" : "s"}`);
              if (ph) bits.push(`${ph} photo${ph === 1 ? "" : "s"}`);
              return bits.length ? `<div class="cellSub">${bits.join(" · ")}</div>` : "";
            })()}`;

      /* An officer works a visit from a laptop as readily as from a phone, so
         the same start/end flow lives here. Which control appears depends on
         where the visit actually is, not on whether the subject confirmed. */
      const actions = requested
        ? `<button class="act" data-schedule="${v.id}">Schedule</button>
           ${ibtn("decline", v.id, "Decline this request", "danger")}`
        : done
        ? ibtn("view", v.id, "View this visit")
        : v.started_at
        ? ibtn("view", v.id, "View this visit")
          + ibtn("end", v.id, "End visit and record what you saw", "go")
          + ibtn("cancel", v.id, "Cancel this visit", "danger")
        /* No Edit once a visit is under way: the officer is standing there,
           and moving a visit they have already arrived at is not a thing that
           happens. A completed one has no Edit either — it is a record, and a
           correction is a note. */
        : ibtn("view", v.id, "View this visit")
          + ibtn("edit", v.id, "Change the date, time or place")
          + ibtn("start", v.id, "Start visit — records your arrival time", "go")
          + ibtn("cancel", v.id, "Cancel this visit", "danger");

      return `<tr>
        <td class="cWhen">${whenCell}</td>
        <td class="cWho">${esc(v.officer || s.officer || "—")}</td>
        <td class="cStatus">
          <span class="pill ${stage.cls}">${stage.label}</span>
          ${stage.at ? `<div class="cellSub">${esc(whenFull(stage.at))}</div>` : ""}
          ${done && v.completed_by ? `<div class="cellSub">by ${esc(v.completed_by)}</div>` : ""}
        </td>
        <td class="cActions">${actions}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="4" class="empty">No visits yet.</td></tr>`;

    Object.entries(typed).forEach(([id, val]) => {
      const i = el(id); if (i && val) i.value = val;
    });

    body.querySelectorAll("[data-schedule]").forEach(b => b.onclick = async () => {
      const id = Number(b.dataset.schedule);
      const when = el(`rq-${id}`)?.value;
      if (!when) return;
      b.disabled = true; b.textContent = "Scheduling…";
      const okd = await writeVisit("/api/visits/schedule",
        { id, scheduled_at: new Date(when).toISOString(), officer: s.officer,
          location: oneLineAddress(s) },
        `Visit scheduled for ${whenFull(new Date(when).toISOString())}`);
      if (!okd) { b.disabled = false; b.textContent = "Schedule"; return; }
      loadVisits(s);
    });

    body.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
      const v = (VISITS || []).find(x => x.id === Number(b.dataset.edit));
      if (v) addVisitModal(s, v);
    });

    body.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
      const v = rows.find(x => x.id === Number(b.dataset.view));
      if (v) showVisit(v, s);
    });

    body.querySelectorAll("[data-start]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      const okd = await writeVisit("/api/visits/start",
        { id: Number(b.dataset.start), officer: s.officer }, "Visit started");
      if (!okd) { b.disabled = false; return; }
      loadVisits(s);
    });

    body.querySelectorAll("[data-end]").forEach(b => b.onclick = () => {
      const v = rows.find(x => x.id === Number(b.dataset.end));
      if (v) endVisitDialog(v, s);
    });

    body.querySelectorAll("[data-decline]").forEach(b => b.onclick = async () => {
      const yes = await confirmModal({
        title: "Decline this request?",
        body: `${s.name.split(" ")[0]} sees the decision in their app immediately.`,
        confirmLabel: "Decline" });
      if (yes && await writeVisit("/api/visits/cancel",
                                  { id: Number(b.dataset.decline) }, "Request declined"))
        loadVisits(s);
    });

    body.querySelectorAll("[data-cancel]").forEach(b => b.onclick = async () => {
      const yes = await confirmModal({
        title: "Cancel this visit?",
        body: `${s.name.split(" ")[0]} sees the cancellation in their app immediately.`,
        confirmLabel: "Cancel visit" });
      if (!yes) return;
      if (await writeVisit("/api/visits/cancel", { id: Number(b.dataset.cancel) },
                           "Visit cancelled")) loadVisits(s);
    });
  } catch {}
}


const noteCount = v => (v.notes_log || []).length;

/* Icon buttons. The title carries the meaning on hover; aria-label carries it
   to a screen reader, which a bare glyph otherwise leaves with nothing. */
const ACT_ICON = {
  view:  `<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>`,
  start: `<path d="M6 4l13 8-13 8V4z"/>`,
  end:   `<path d="M20 6L9 17l-5-5"/>`,
  cancel:`<path d="M18 6L6 18M6 6l12 12"/>`,
  edit:  `<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>`,
  decline:`<path d="M18 6L6 18M6 6l12 12"/>`
};
const ibtn = (kind, id, label, cls = "") => `
  <button class="iact ${cls}" data-${kind}="${id}" data-tip="${esc(label)}" aria-label="${esc(label)}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">${ACT_ICON[kind]}</svg>
  </button>`;

/**
 * End a visit from the desk.
 *
 * The same observations the app captures, because an officer works a visit
 * from a laptop as readily as from a phone and the record must not depend on
 * which device they had. The field list comes from OBSERVED, which the app
 * also builds its form from — one source, so the two cannot drift.
 */
function endVisitDialog(v, s) {
  const group = (key, [label, values]) => `
    <label>${esc(label)}</label>
    <div class="levels" data-obs="${key}">
      ${Object.entries(values).map(([val, text]) => `
        <label class="lvl">
          <input type="radio" name="o_${key}" value="${esc(val)}">
          <span>${esc(text)}</span>
        </label>`).join("")}
    </div>`;

  showModal("End visit", `${s.name} · started ${whenFull(v.started_at) || "just now"}`, `
    <div id="obsFields">
      ${Object.entries(OBSERVED).map(([k, def]) => group(k, def)).join("")}
    </div>

    <div id="cbDetailWrap" style="display:none">
      <label for="o_cbdetail">What was seen</label>
      <input id="o_cbdetail" placeholder="Describe what was observed">
    </div>

    <label for="o_others">Others present <span class="opt">(optional)</span></label>
    <input id="o_others" placeholder="Anyone else at the location">

    <label for="o_concerns">Concerns <span class="opt">(optional)</span></label>
    <input id="o_concerns" placeholder="Anything the answers above do not cover">

    <label for="o_note">Visit notes</label>
    <textarea id="o_note" rows="4" placeholder="What happened during the visit?"></textarea>
    <p class="mnote">The end time is recorded now. Notes are append-only &mdash; a
       correction is a new note, never an edit.</p>

    <div class="mactions">
      <button class="linkbtn" onclick="closeModal()">Cancel</button>
      <button class="btn small" id="o_save">Record visit</button>
    </div>`);

  const pick = key => document.querySelector(`input[name="o_${key}"]:checked`)?.value;

  /* Nothing else is assessable through a closed door. */
  const sync = () => {
    const noContact = pick("subject_present") === "no_contact";
    document.querySelectorAll("#obsFields [data-obs]").forEach(g => {
      if (g.dataset.obs === "subject_present") return;
      // The group and the label above it hide together.
      g.style.display = noContact ? "none" : "";
      g.previousElementSibling.style.display = noContact ? "none" : "";
    });
    el("cbDetailWrap").style.display =
      !noContact && pick("contraband") === "observed" ? "" : "none";
    document.querySelectorAll(".levels .lvl").forEach(l =>
      l.classList.toggle("on", l.querySelector("input").checked));
  };
  document.querySelectorAll("#obsFields input").forEach(r => r.onchange = sync);
  sync();

  el("o_save").onclick = async () => {
    const btn = el("o_save"); btn.disabled = true; btn.textContent = "Saving\u2026";
    const noContact = pick("subject_present") === "no_contact";
    const ok = await writeVisit("/api/visits/complete", {
      id: v.id, officer: s.officer, note: el("o_note").value.trim() || null,
      observations: {
        subject_present: pick("subject_present"),
        location_safe: noContact ? null : pick("location_safe"),
        contraband: noContact ? null : pick("contraband"),
        contraband_detail: !noContact && pick("contraband") === "observed"
          ? el("o_cbdetail").value.trim() : null,
        demeanour: noContact ? null : pick("demeanour"),
        others_present: el("o_others").value.trim() || null,
        concerns: el("o_concerns").value.trim() || null
      }
    }, "Visit recorded");
    if (!ok) { btn.disabled = false; btn.textContent = "Record visit"; return; }
    closeModal();
    loadVisits(s);
  };
}

/**
 * One visit, in full.
 *
 * A schedule row answers "when, who, what state". Everything the officer
 * recorded at the door — the on-site window, four observations, who else was
 * there, concerns, and the note log — needs room to be read, and cramming it
 * into a table cell made the row unreadable without making the detail legible.
 */
/* ---------------- visit agenda ----------------
   What the visit is for. Built from the case file when the visit is booked and
   kept as the visit's own record afterwards — see db/agenda.mjs. */
const AG_SOURCE = { financial: "Money", date: "Appointment", goal: "Goal",
                    program: "Training", custom: "Added by officer" };

const agPreviewRow = i => `
  <div class="agendaItem">
    <span class="agendaSrc ${esc(i.source_kind)}">${esc(AG_SOURCE[i.source_kind] || "")}</span>
    <div style="flex:1;min-width:0">
      <div class="agendaBody">${esc(i.body)}</div>
      ${i.detail ? `<div class="agendaDetail">${esc(i.detail)}</div>` : ""}
    </div>
  </div>`;

function agRow(i) {
  const done = !!i.covered_at;
  return `
    <div class="agendaItem ${done ? "covered" : ""}">
      <button class="goalTick ${done ? "on" : ""}" data-ag-cover="${i.id}"
              data-covered="${done ? "0" : "1"}"
              data-tip="${done ? "Mark not discussed" : "Mark discussed"}">${
        done ? "&#10003;" : ""}</button>
      <span class="agendaSrc ${esc(i.source_kind)}">${esc(AG_SOURCE[i.source_kind] || "")}</span>
      <div style="flex:1;min-width:0">
        <div class="agendaBody">${esc(i.body)}</div>
        ${i.detail ? `<div class="agendaDetail">${esc(i.detail)}</div>` : ""}
        ${i.note ? `<div class="agendaNote">${esc(i.note)}</div>` : ""}
        ${done ? `<div class="agendaDetail">Discussed &middot; ${esc(i.covered_by || "")}</div>` : ""}
      </div>
      <button class="linkbtn" data-ag-note="${i.id}" data-tip="Record what was said">Note</button>
      <button class="linkbtn danger" data-ag-del="${i.id}" data-tip="Take this off the agenda">&times;</button>
    </div>`;
}

/** The agenda block inside a visit's detail, plus its wiring. */
/* ================================================================
   Transcription and summary.

   Two rules run through all of this and are worth stating where they are
   implemented rather than only in the docs:

   · Nothing starts on its own. An officer presses a button and audio of a
     supervision conversation leaves the building. That is a decision, not a
     consequence of having pressed stop at a door.
   · An action item a model proposed is a suggestion until an officer accepts
     it. Nothing here writes an obligation for anybody.

   Both jobs answer 202 and are polled. The poll stops on its own when the
   modal closes — an interval left running against a screen nobody is looking
   at is how a page ends up making requests forever.
================================================================ */

/**
 * Attaching audio recorded somewhere other than the app.
 *
 * The officer's phone is not the only thing that records a visit — a Voice
 * Memo, or audio pulled off a handset afterwards, is the same evidence. It
 * goes through the SAME endpoint as an in-app recording, so there is one path
 * into the table and one set of rules on it, rather than a second, laxer door
 * that exists because a demo needed one.
 */
function wireRecordingUpload(v) {
  const btn = el("recUpload"), file = el("recFile"), stat = el("recStat");
  if (!btn || !file) return;

  /* What the server will accept, keyed off the extension, because browsers
     disagree about the type they report for .m4a — Safari says audio/x-m4a,
     Chrome often says audio/mp4, and some report nothing at all. */
  const TYPE_FOR = { m4a: "audio/m4a", mp4: "audio/mp4", aac: "audio/aac",
                     mp3: "audio/mpeg", mpeg: "audio/mpeg", webm: "audio/webm" };
  const MAX = 25 * 1024 * 1024;

  btn.onclick = async () => {
    const f = file.files?.[0];
    if (!f) { toast("Choose an audio file first", "err"); return; }
    if (f.size > MAX) {
      toast(`That file is ${(f.size / 1048576).toFixed(1)} MB. The limit is 25 MB.`, "err");
      return;
    }
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const mime = TYPE_FOR[ext];
    if (!mime) {
      toast(`Waypoint cannot read a .${ext} file. Send m4a, mp3, aac or webm.`, "err");
      return;
    }

    /* Confirm WHO this is being filed against, before it is.
       A recording attached to the wrong person is quiet and expensive: it is
       append-only, so it cannot be taken back, and every action item found in
       it lands on that person's list as work they never agreed to. The file
       picker gives no clue whose visit is open behind it. */
    const subj = subjectOf(v.subject_id);
    const who = subj?.name || v.subject_id;
    const reopen = async () => {
      try {
        const d = await fetch(`/api/visits?subject_id=${encodeURIComponent(v.subject_id)}`)
                    .then(r => r.json());
        const fresh = (d.visits || []).find(x => x.id === v.id);
        if (fresh) showVisit(fresh, subj || null);
      } catch { /* the modal simply stays closed */ }
    };

    const go = await confirmModal({
      title: `Attach this recording to ${who}?`,
      body: `"${f.name}" will be filed against the ${
        whenFull(v.scheduled_at) || "undated"} visit for ${who}. `
        + `It is transcribed automatically, and anything ${who} agreed to in it `
        + `becomes an action item on their list. A recording cannot be removed `
        + `once attached.`,
      confirmLabel: "Attach recording", danger: false });
    if (!go) { await reopen(); return; }

    try {
      /* base64 in the JSON body, the same shape the phone sends — this server
         has no multipart parser and does not need one. */
      const data = await new Promise((ok, no) => {
        const r = new FileReader();
        r.onerror = () => no(new Error("That file could not be read."));
        r.onload = () => ok(String(r.result).split(",")[1] || "");
        r.readAsDataURL(f);
      });
      await api("/api/visits/recording", { id: v.id, data, mime_type: mime,
                                           note: `Uploaded: ${f.name}` });
      toast(`Recording attached to ${who} — ${f.name}`);
      /* Re-read the visit rather than patching this copy: the same reason the
         agenda re-reads, and the recordings list is rendered from the record. */
      const d = await fetch(`/api/visits?subject_id=${encodeURIComponent(v.subject_id)}`)
                  .then(r => r.json());
      const fresh = (d.visits || []).find(x => x.id === v.id);
      if (fresh) showVisit(fresh, subjectOf(fresh.subject_id) || null);
    } catch (e) {
      toast(e.message || "Could not attach that recording", "err");
      await reopen();
    }
  };
}

let aiPoll = null;
const stopAiPoll = () => { clearInterval(aiPoll); aiPoll = null; };

const AI_OWNER = { officer: "Officer", subject: "Subject", unclear: "Unclear" };

/** The machine-generated banner. Shown every time, deliberately unmissable. */
const aiCaveat = what => `
  <div class="aiWarn"><span>&#9888;</span><span>This ${what} was produced by a
    machine from an audio recording and has not been checked by a person. It
    will contain errors, particularly in names, numbers, dates and addresses.
    The recording is the record.</span></div>`;

async function paintAi(v) {
  const box = el("aiBox"); if (!box) return;
  const todayISO = new Date().toISOString().slice(0, 10);

  let cap = { transcription: false, summary: false };
  try { cap = await fetch("/api/insights/capabilities").then(r => r.json()); }
  catch { /* leave both off — a button that can only fail is worse than none */ }

  const fresh = await fetch(`/api/visits?subject_id=${encodeURIComponent(v.subject_id)}`)
    .then(r => r.json()).then(d => (d.visits || []).find(x => x.id === v.id))
    .catch(() => null);
  const visit = fresh || v;
  const transcripts = visit.transcripts || [];
  const summaries = visit.summaries || [];
  const byRec = Object.fromEntries(transcripts.map(t => [t.recording_id, t]));

  /* ---- one control per recording, beside the player it belongs to ---- */
  document.querySelectorAll("[data-tx-for]").forEach(slot => {
    const rid = Number(slot.dataset.txFor);
    const t = byRec[rid];
    if (!cap.transcription && !t) {
      slot.innerHTML = `<span class="aiStat" data-tip="Set WAYPOINT_STT_KEY on the server">Transcription off</span>`;
      return;
    }
    if (!t) {
      slot.innerHTML = `<button class="btn small" data-tx="${rid}">Transcribe</button>`;
      return;
    }
    if (t.status === "queued" || t.status === "running")
      slot.innerHTML = `<span class="aiStat">Transcribing&hellip;</span>`;
    else if (t.status === "failed")
      slot.innerHTML = `<span class="aiStat" data-tip="${esc(t.error || "")}">Failed</span>
                        <button class="btn small" data-tx="${rid}">Try again</button>`;
    else
      slot.innerHTML = `<span class="aiStat">${t.word_count} words</span>
        <a class="btn small" href="/visit-transcripts/${t.id}">Download</a>
        <button class="btn small" data-tx-show="${t.id}">Read</button>`;
  });

  document.querySelectorAll("[data-tx]").forEach(b => b.onclick = async () => {
    const label = b.textContent; b.disabled = true; b.textContent = "Starting…";
    try {
      await api("/api/visits/recording/transcribe", { recording_id: +b.dataset.tx });
      toast("Transcribing — this takes a minute or two");
      paintAi(visit);
    } catch (e) { toast(e.message, "err"); }
    finally { b.disabled = false; b.textContent = label; }
  });

  document.querySelectorAll("[data-tx-show]").forEach(b => b.onclick = () => {
    const t = transcripts.find(x => x.id === +b.dataset.txShow);
    const open = el(`txText-${t.id}`);
    if (open) { open.remove(); return; }
    const d = document.createElement("div");
    d.id = `txText-${t.id}`;
    d.innerHTML = aiCaveat("transcript") + `<div class="aiText">${esc(t.text || "")}</div>`;
    b.closest(".vrecRow").after(d);
  });

  /* ---- the summary ---- */
  const ready = transcripts.filter(t => t.status === "done" && t.text);
  const latest = summaries[0];
  const working = latest && (latest.status === "queued" || latest.status === "running");

  /* The summary follows the transcript on its own — an officer should not have
     to remember a second button. What is left here is a re-run, for when the
     transcript has been redone or the first reading was poor. */
  const txWorking = transcripts.some(t => t.status === "queued" || t.status === "running");

  let head = "";
  if (!cap.summary)
    head = `<p class="aiNote">Summarising is off on this server
            (set <code>WAYPOINT_LLM_KEY</code>).</p>`;
  else if (working)
    head = `<span class="aiStat">Writing the summary&hellip;</span>`;
  else if (txWorking)
    head = `<span class="aiStat">Waiting on the transcript&hellip;</span>`;
  else if (!ready.length)
    head = `<p class="aiNote">Nothing to summarise yet. Transcribe a recording
            and the summary follows automatically &mdash; it is written from the
            transcript, not from the audio.</p>`;
  else if (!summaries.length)
    head = `<button class="btn small" id="ai_sum">Write the summary</button>
      <span class="aiNote">Normally automatic after transcribing.
      Reads ${ready.length} transcript${ready.length === 1 ? "" : "s"}.</span>`;
  else
    head = `<button class="btn small" id="ai_sum">Write it again</button>
      <span class="aiNote">Reads ${ready.length} transcript${ready.length === 1 ? "" : "s"}.
      Earlier summaries are kept.</span>`;

  box.innerHTML = `<h4 class="vdHead">Visit Summary</h4>${head}`
    + (latest && latest.status === "failed"
        ? `<p class="aiNote">The last attempt failed &mdash; ${esc(latest.error || "")}</p>` : "")
    + (latest && latest.status === "done" ? `
        ${aiCaveat("summary")}
        ${latest.headline ? `<p class="aiHeadline">${esc(latest.headline)}</p>` : ""}

        <h4 class="vdHead">What was discussed</h4>
        <div class="aiText">${esc(latest.body || "")}</div>
        <p class="aiNote">Written ${esc(whenFull(latest.created_at))}
          by ${esc(latest.model || "a model")}${
            latest.requested_by ? `, at ${esc(latest.requested_by)}'s request` : ""}.</p>

        <h4 class="vdHead">Action items${
          latest.actions.length ? ` <span class="reBy">${latest.actions.length}</span>` : ""}</h4>
        ${latest.actions.length ? latest.actions.map((a, i) => `
          <div class="aiAct ${a.status === "accepted" ? "done"
                            : a.status === "dismissed" ? "dropped" : ""}">
            <div class="aiActNo">${i + 1}.</div>
            <div>
              ${a.status === "accepted"
                ? `<button class="aiActBody aiEditable" data-editbody="${a.id}"
                           data-tip="Click to fix the wording">${esc(a.body)}</button>`
                : `<div class="aiActBody">${esc(a.body)}</div>`}
              <div class="aiActMeta">
                ${a.status === "accepted"
                  ? `<select class="aiOwner" data-act-owner="${a.id}">
                       ${["officer","subject","unclear"].map(o =>
                         `<option value="${o}"${a.owner === o ? " selected" : ""}>${
                           AI_OWNER[o]}</option>`).join("")}
                     </select>`
                  : `<span class="aiOwner">${esc(AI_OWNER[a.owner] || "Unclear")}</span>`}
                ${a.status === "accepted"
                  ? `<input type="date" class="aiDue ${
                       a.due_date && a.due_date < todayISO ? "late" : ""}"
                       value="${esc(a.due_date || "")}" data-act-due="${a.id}"
                       data-tip="${a.due_hint
                         ? esc(`Heard as "${a.due_hint}" — set the real date if that is wrong`)
                         : "No date was spoken. Set one if it needs a deadline."}">`
                  : a.due_date ? `<span class="aiDue">${esc(a.due_date)}</span>` : ""}
                ${a.due_hint ? `<span>&ldquo;${esc(a.due_hint)}&rdquo;</span>` : ""}
                ${a.owner_proposed && a.owner_proposed !== a.owner
                  ? `<span class="aiOwnerFixed">corrected from ${
                       esc(AI_OWNER[a.owner_proposed] || a.owner_proposed)}</span>` : ""}
                ${a.body_proposed && a.body_proposed !== a.body
                  ? `<span class="aiOwnerFixed" data-tip="${esc(a.body_proposed)}"
                       >wording <b>edited</b></span>` : ""}
                ${a.status === "dismissed"
                  ? `<span>Removed by ${esc(a.decided_by || "—")}</span>` : ""}
                ${a.status === "done"
                  ? `<span>Done by ${esc(a.done_by || "—")}</span>` : ""}
              </div>
              ${a.quote ? `<div class="aiActQuote">&ldquo;${esc(a.quote)}&rdquo;</div>` : ""}
            </div>
            <div class="vrecAct">${a.status === "dismissed"
              ? `<button class="btn small ghost" data-act-undo="${a.id}">Put back</button>`
              : a.status === "done" ? ""
              : `<button class="btn small ghost" data-act-no="${a.id}"
                         data-tip="Remove — the recording did not actually say this"
                  >Remove</button>`}</div>
          </div>`).join("")
        : `<p class="aiNote">Nothing was agreed &mdash; the model was told to return
            an empty list rather than invent follow-ups.</p>`}
        <p class="mnote">These go straight on the subject's list. Change the owner
          if it landed on the wrong person, and remove anything the recording did
          not actually say &mdash; the transcript has no speaker labels, so who owns
          an item is inferred from how the sentence was phrased.</p>
`
      : "");

  const sum = el("ai_sum");
  if (sum) sum.onclick = async () => {
    sum.disabled = true; sum.textContent = "Starting…";
    try {
      await api("/api/visits/summarise", { id: visit.id });
      toast("Writing the summary — this takes a moment");
      paintAi(visit);
    } catch (e) { toast(e.message, "err"); sum.disabled = false; }
  };

  const decide = (sel, status, msg) =>
    document.querySelectorAll(sel).forEach(b => b.onclick = async () => {
      b.disabled = true;
      try {
        await api("/api/visits/summary/action",
                  { id: +(b.dataset.actNo || b.dataset.actUndo), status });
        toast(msg);
        paintAi(visit);
      } catch (e) { toast(e.message, "err"); b.disabled = false; }
    });
  /* Whisper does not label speakers, so who an action belongs to is inferred
     from phrasing — and phrasing and ownership come apart wherever the officer
     INSTRUCTS the subject. This is the correction for that. */
  document.querySelectorAll("[data-act-owner]").forEach(sel => sel.onchange = async () => {
    const was = sel.value;
    sel.disabled = true;
    try {
      await api("/api/visits/summary/action",
                { id: Number(sel.dataset.actOwner), owner: was });
      toast(`Assigned to the ${was === "unclear" ? "record as unclear" : was}`);
      paintAi(visit);
    } catch (e) { toast(e.message, "err"); sel.disabled = false; }
  });

  /* The same in-place edit the Action Items module has. This is where an
     officer first reads what the model produced, so it is where a wrong word
     most wants fixing — "book the test anyway" came back as "book the written
     DRIVING test", and nobody said driving. */
  /* The date, settable here as well as in the module.
     "next Friday" heard off a doorstep is a guess at what somebody meant; the
     officer who was standing there knows. A phrase the resolver could not read
     at all leaves the field empty rather than inventing a deadline. */
  document.querySelectorAll("[data-act-due]").forEach(inp => inp.onchange = async () => {
    try {
      await api("/api/visits/summary/action",
                { id: Number(inp.dataset.actDue), due_date: inp.value || null });
      toast(inp.value ? `Due ${inp.value}` : "Due date cleared");
      paintAi(visit);
    } catch (e) { toast(e.message, "err"); }
  });

  document.querySelectorAll("[data-editbody]").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.editbody), was = b.textContent.trim();
    const input = document.createElement("input");
    input.className = "aiEditInput"; input.value = was;
    b.replaceWith(input);
    input.focus(); input.setSelectionRange(was.length, was.length);

    let settled = false;
    const finish = async save => {
      if (settled) return; settled = true;
      const next = input.value.trim();
      if (!save || !next || next === was) return paintAi(visit);
      try {
        await api("/api/visits/summary/action", { id, body: next });
        toast("Wording corrected");
      } catch (e) { toast(e.message, "err"); }
      paintAi(visit);
    };
    input.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    };
    input.onblur = () => finish(true);
  });

  decide("[data-act-no]", "dismissed", "Removed from the list");
  decide("[data-act-undo]", "accepted", "Put back on the list");

  /* Keep polling only while something is actually in flight. */
  /* Keep polling through the transcript too: the summary starts by itself when
     that finishes, so stopping at the transcript would leave the screen showing
     "waiting" while the summary quietly completed behind it. */
  const busy = working || txWorking;
  stopAiPoll();
  if (busy && el("aiBox")) aiPoll = setInterval(() => {
    if (!el("aiBox")) return stopAiPoll();
    paintAi(visit);
  }, 3000);
}

function paintAgenda(v, s, reload) {
  const box = el("agBox"); if (!box) return;
  const ag = v.agenda || [];
  const done = ag.filter(i => i.covered_at).length;

  box.innerHTML = `
    <div class="agendaHead">
      <h4 class="vdHead" style="margin:0">Agenda
        ${ag.length ? `<span class="reBy">${done} of ${ag.length} discussed</span>` : ""}</h4>
      <button class="linkbtn" id="ag_refresh"
              data-tip="Pull in anything raised since this visit was booked">Refresh</button>
    </div>
    ${ag.length ? `<div class="agendaList">${ag.map(agRow).join("")}</div>`
      : `<p class="muted">Nothing on the agenda.</p>`}
    <div class="goalAdd">
      <input id="ag_new" placeholder="Add an item — e.g. ask about the car insurance">
      <button class="btn small ghost" id="ag_add">Add</button>
    </div>`;

  const post = async (url, payload, okMsg) => {
    try { await api(url, payload); toast(okMsg); await reload(); }
    catch (e) { toast(e.message, "err"); }
  };

  el("ag_refresh").onclick = async () => {
    try {
      const d = await api("/api/visits/agenda/refresh", { id: v.id });
      toast(d.added ? `${d.added} item${d.added === 1 ? "" : "s"} added`
                    : "Nothing new to add");
      await reload();
    } catch (e) { toast(e.message, "err"); }
  };

  const add = async () => {
    const body = el("ag_new").value.trim();
    if (!body) return toast("An agenda item cannot be empty.", "err");
    await post("/api/visits/agenda/item", { visit_id: v.id, body }, "Agenda item added");
  };
  el("ag_add").onclick = add;
  el("ag_new").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); add(); } };

  box.querySelectorAll("[data-ag-cover]").forEach(b => b.onclick = () =>
    post("/api/visits/agenda/item/cover",
         { id: Number(b.dataset.agCover), covered: b.dataset.covered === "1" },
         b.dataset.covered === "1" ? "Marked discussed" : "Marked not discussed"));

  box.querySelectorAll("[data-ag-note]").forEach(b => b.onclick = async () => {
    const item = ag.find(x => x.id === Number(b.dataset.agNote));
    const note = await promptModal({
      title: "What was said?", body: item.body,
      label: "Note", value: item.note || "",
      placeholder: "e.g. says he will pay $50 on the 1st",
      confirmLabel: "Save note" });
    showVisit(v, s);
    if (note === null) return;
    await post("/api/visits/agenda/item/cover",
      { id: item.id, covered: true, note }, "Noted, and marked discussed");
  });

  box.querySelectorAll("[data-ag-del]").forEach(b => b.onclick = () =>
    post("/api/visits/agenda/item/delete", { id: Number(b.dataset.agDel) },
         "Taken off the agenda"));
}

function showVisit(v, s) {
  const row = (label, value) => value
    ? `<div class="vdRow"><dt>${esc(label)}</dt><dd>${value}</dd></div>` : "";

  const minutes = v.started_at && v.ended_at
    ? Math.max(1, Math.round((new Date(v.ended_at) - new Date(v.started_at)) / 60000)) : null;

  const observed = Object.entries(OBSERVED)
    .filter(([k]) => v[k])
    .map(([k, [label, values]]) => `
      <div class="vdRow"><dt>${esc(label)}</dt>
        <dd class="${OBSERVED_FLAG.has(v[k]) ? "flagged" : ""}">
          ${esc(values[v[k]] || v[k])}</dd></div>`).join("");

  showModal("Visit", `${s.name} · ${whenFull(v.scheduled_at) || "no date set"}`, `
    <dl class="vdetail">
      ${row("Status", `<span class="pill ${v.status === "completed" ? "ok" : "go"}">${esc(v.status)}</span>`)}
      ${row("Officer", esc(v.officer || s.officer || ""))}
      ${row("Location", addressBlock(v.location))}
      ${row("On site", v.started_at
          ? `${esc(whenFull(v.started_at))}${v.ended_at ? ` &ndash; ${esc(when(v.ended_at))}` : ""}${
              minutes ? ` &middot; ${minutes} min` : ""}`
          : "")}
      ${row("Subject confirmed", v.accepted_at ? esc(whenFull(v.accepted_at))
          : v.seen_at ? "Seen, not confirmed" : "Not confirmed")}
      ${row("Instruction given", esc(v.notes || ""))}
    </dl>

    ${observed ? `<h4 class="vdHead">What the officer observed</h4>
      <dl class="vdetail">${observed}
        ${row("Contraband detail", esc(v.contraband_detail || ""))}
        ${row("Others present", esc(v.others_present || ""))}
        ${row("Concerns", esc(v.concerns || ""))}
      </dl>` : ""}

    ${(v.photos || []).length ? `
      <h4 class="vdHead">Photographs</h4>
      <div class="photoGrid">
        ${(v.photos || []).map(p => `
          <a class="photo" href="/visit-photos/${p.id}" target="_blank"
             data-tip="${esc(p.caption || "Taken by " + (p.author || "unknown"))}">
            <img src="/visit-photos/${p.id}" alt="${esc(p.caption || "Visit photograph")}">
          </a>`).join("")}
      </div>` : ""}

    <h4 class="vdHead">Audio recorded at the visit</h4>
    ${v.status === "cancelled" ? `
      <p class="mnote">This visit was cancelled, so it never took place and no
        audio can be filed against it.</p>`
    : `
      <div class="vrecAdd">
        <input type="file" id="recFile" accept="audio/*,.m4a,.mp3,.aac">
        <button class="btn small" id="recUpload">Attach recording</button>
        <span class="aiStat" id="recStat"></span>
      </div>
      <p class="mnote">For a recording made on a phone rather than in the app
        &mdash; a Voice Memo, or audio pulled off a handset. It is filed against
        this visit exactly as an in-app recording is, and transcribes the same
        way. A completed visit still accepts audio &mdash; the recording was made
        at the door, and uploading it later from a desk is only transfer time.
        Limit 25&nbsp;MB.</p>`}

    ${(v.recordings || []).length ? `
      ${(v.recordings || []).map((r, i) => `
        <div class="vrecRow">
          <div class="vrecMeta">
            <b>Recording ${i + 1}${r.duration_ms ? ` &middot; ${clockMs(r.duration_ms)}` : ""}</b>
            ${esc(r.author || "")}${r.author ? " &middot; " : ""}${esc(whenFull(r.created_at))}
          </div>
          <audio controls preload="none" src="/visit-recordings/${r.id}"></audio>
          <div class="vrecAct" data-tx-for="${r.id}"></div>
        </div>`).join("")}
      <p class="mnote">Recordings are append-only, like the notes and the
        photographs &mdash; there is no way to remove one.</p>
      <div id="aiBox" class="aiPanel"></div>` : ""}

    <div id="agBox"></div>

    <h4 class="vdHead">Notes</h4>
    ${(v.notes_log || []).length
      ? (v.notes_log || []).map(n => `
          <div class="vnote">${esc(n.body)}
            <span>${esc(n.author || "")}${n.author ? " &middot; " : ""}${esc(whenFull(n.created_at))}</span>
          </div>`).join("")
      : `<p class="mempty">No notes recorded.</p>`}
    <p class="mnote">Notes are append-only &mdash; a correction is a new note, never an edit.</p>`);

  /* Re-read the visit rather than patching the copy this modal was opened
     with: an agenda change alters the whole record, and a half-refreshed
     screen is how two views of one visit start disagreeing. */
  wireRecordingUpload(v);
  paintAi(v);
  paintAgenda(v, s, async () => {
    const d = await fetch(`/api/visits?subject_id=${encodeURIComponent(s.subject_id)}`)
                .then(r => r.json());
    const fresh = (d.visits || []).find(x => x.id === v.id);
    if (fresh) showVisit(fresh, s);
  });
}

/**
 * Assigning a program, in a modal — the same shape as Add Visit.
 *
 * The catalogue is fetched when the modal opens rather than on page load: it
 * is only needed by somebody who is about to assign something, and fetching
 * it up front made a failure to reach Waypoint look like a broken screen
 * rather than a form that cannot be filled in yet.
 */
function assignProgramModal(s) {
  showModal("Assign Program", `${s.name} — ${s.case_number}`, `
    <p class="hint">Content is pulled live from Waypoint. The subject needs a
       Waypoint login to open what you assign — create one from their profile.</p>

    <label for="program">Program</label>
    <select id="program"><option>Loading&hellip;</option></select>

    ${reFoot("Assign program", "assign")}`);

  const btn = el("assign");
  btn.disabled = true;

  fetch("/api/catalog").then(r => r.json()).then(d => {
    const items = d.content || [];
    el("program").innerHTML = items.length
      ? items.map(c => `<option value="${esc(c.program_id)}">${esc(c.title)} &mdash; ${c.scorm_version === "xAPI" ? "xAPI" : `SCORM ${esc(c.scorm_version)}`}</option>`).join("")
      : `<option value="">No content available</option>`;
    btn.disabled = !items.length;
  }).catch(() => {
    el("program").innerHTML = `<option value="">Couldn't reach Waypoint</option>`;
  });

  btn.onclick = async () => {
    const program_id = el("program").value;
    if (!program_id) return;
    const title = el("program").selectedOptions[0].text.split(" — ")[0];
    btn.disabled = true; btn.textContent = "Assigning\u2026";
    try {
      const r = await fetch("/api/assign", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subject_id: s.subject_id, name: s.name, program_id })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
      closeModal();
      toast(`${title} assigned`);
      // Assigned, but they cannot open it. Say so loudly rather than in a
      // panel they have just navigated away from.
      if (d.needs_login)
        toast(`${s.name.split(" ")[0]} has no Waypoint login and cannot open it `
            + `— create one from their profile.`, "err");
      refresh(s);
    } catch (e) {
      toast(String(e.message || e), "err");
      btn.disabled = false; btn.textContent = "Assign program";
    }
  };
}
