/* A save that re-renders to the same values looks exactly like a save that
   did not happen. Say so. */
/** POST JSON and throw the server's own message on failure, so the caller can
 *  show it rather than inventing one. */
/**
 * A dead session is not an error to report, it is a reason to sign in.
 *
 * Wrapped around fetch itself rather than added to each caller, for the same
 * reason the staff gate lives in one place on the server: a screen added later
 * is covered by default instead of by whoever writes it remembering to.
 *
 * Before this, an expired session showed whatever the failing call happened to
 * say — "Request failed (401)" in a toast, or nothing at all — while the page
 * carried on displaying data from before it expired. The officer's session had
 * ended and the screen did not say so.
 */
(function signOutOnExpiry() {
  const raw = window.fetch;
  window.fetch = async (input, init) => {
    const r = await raw(input, init);
    const path = typeof input === "string" ? input : input?.url || "";
    // Sign-in itself answers 401 for a wrong password; that is a message on
    // the form, not a session ending.
    if (r.status === 401 && !path.includes("/auth/login") && USER) {
      USER = null;
      showSignIn("Your session ended. Please sign in again.");
    }
    return r;
  };
})();

async function api(path, body) {
  const r = await fetch(path, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error("Your session ended.");
  if (!r.ok) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}

function toast(msg, kind = "ok") {
  document.getElementById("toast")?.remove();
  const t = document.createElement("div");
  t.id = "toast"; t.className = `toast ${kind}`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("in"));
  setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 250); }, 2200);
}

/** A visit write. These had no feedback at all: a refused schedule looked
 *  exactly like a successful one. Returns whether it actually saved. */
async function writeVisit(path, body, okMsg) {
  try {
    const r = await fetch(path, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { toast(d.error || `Could not save (HTTP ${r.status})`, "err"); return false; }
    toast(okMsg);
    return true;
  } catch {
    toast("Couldn't reach the server — nothing was saved.", "err");
    return false;
  }
}

async function agPost(path, body, s, okMsg) {
  const r = await fetch(path, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.error || `Could not save (HTTP ${r.status})`, "err"); return false; }
  AG.agreement = d.agreement ?? AG.agreement;
  paintAgreement(s);
  if (d.amended) toast("Saved — the subject must acknowledge the change", "warn");
  else if (okMsg) toast(okMsg);
  return true;
}

const sel = (id, opts, val, blank) => `<select id="${id}">${
  blank ? `<option value="">${blank}</option>` : ""}${opts.map(([v, l]) =>
  `<option value="${esc(v)}"${String(v) === String(val ?? "") ? " selected" : ""}>${esc(l)}</option>`)
  .join("")}</select>`;

function wireCrumbs(s) {
  const r = el("toRoster"), p2 = el("toProfile");
  if (r) r.onclick = () => { location.hash = ""; };
  if (p2) p2.onclick = () => { location.hash = `/subject/${s.subject_id}`; };
}

function wireAgreement(s, a, editable) {
  /* Fields save when you leave them.
     The conditions between these two sections already saved the moment they
     were added, so a Save button on either side of them was the odd one out —
     and a page with two Save buttons invites the question of which one covers
     what. A field is saved only if its value actually changed, so tabbing
     through the form does not fire a write per field, and /api/agreement/save
     merges, so each one touches only itself. */
  const FIELDS = {
    ag_kind: "kind", ag_level: "supervision_level",
    ag_start: "start_date", ag_end: "end_date",
    ag_office: "office", ag_officer: "officer_name",
    ag_viol: "violation_text"
  };
  const LABEL = {
    kind: "Supervision type", supervision_level: "Supervision level",
    start_date: "Start date", end_date: "Expiry date", office: "Office",
    officer_name: "Supervising officer", violation_text: "Violation language"
  };

  for (const [id, field] of Object.entries(FIELDS)) {
    const input = el(id);
    if (!input) continue;
    const original = input.value;
    const save = () => {
      const value = input.value.trim();
      if (value === original.trim()) return;          // nothing to write
      agPost("/api/agreement/save",
             { id: a.id, [field]: value || null }, s, `${LABEL[field]} saved`);
    };
    input.addEventListener("blur", save);
    // A select or a date picker is "done" the moment it changes; waiting for
    // blur there just delays the confirmation.
    if (input.tagName === "SELECT" || input.type === "date")
      input.addEventListener("change", save);
  }

  view.querySelectorAll(".tplsel").forEach(selEl => selEl.onchange = () => {
    const i = selEl.value; if (i === "") return;
    const t = AG.templates[selEl.dataset.cat][Number(i)];
    selEl.value = "";
    agPost("/api/agreement/condition",
      { agreement_id: a.id, category: selEl.dataset.cat, body: t.body }, s, "Condition added");
  });

  view.querySelectorAll("[data-custom]").forEach(b =>
    b.onclick = () => conditionDialog(s, a, { category: b.dataset.custom }));
  view.querySelectorAll("[data-editc]").forEach(b => {
    const c = (a.conditions || []).find(x => x.id === Number(b.dataset.editc));
    b.onclick = () => conditionDialog(s, a, c);
  });

  view.querySelectorAll("[data-delc]").forEach(b => b.onclick = async () => {
    const c = (a.conditions || []).find(x => x.id === Number(b.dataset.delc));
    const yes = await confirmModal({
      title: "Remove this condition?",
      body: (c ? `"${c.body}" ` : "") + (a.subject_signed_at
        ? `will be removed. ${s.name.split(" ")[0]} must acknowledge the agreement again.`
        : "will be removed from the agreement."),
      confirmLabel: "Remove condition" });
    if (yes) agPost("/api/agreement/condition/delete",
                    { id: Number(b.dataset.delc), agreement_id: a.id }, s, "Condition removed");
  });

  view.querySelectorAll("[data-track]").forEach(b => {
    const c = (a.conditions || []).find(x => x.id === Number(b.dataset.track));
    b.onclick = () => trackDialog(s, a, c);
  });

  const pdf = el("ag_pdf");
  if (pdf) pdf.onclick = async () => {
    pdf.disabled = true; pdf.textContent = "Generating…";
    try {
      const r = await fetch("/api/agreement/pdf", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: a.id }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Could not generate");
      toast("PDF filed to the subject's documents");
      window.open(`/documents/${d.document.id}`, "_blank");
    } catch (e) { toast(String(e.message || e), "err"); }
    finally { pdf.disabled = false; pdf.textContent = "Generate PDF"; }
  };

  const sign = el("ag_sign");
  if (sign) sign.onclick = () => agPost("/api/agreement/sign", { id: a.id }, s, "Signed");

  const act = el("ag_activate");
  if (act) act.onclick = () => agPost("/api/agreement/save", {
    id: a.id, kind: a.kind, supervision_level: a.supervision_level,
    start_date: a.start_date, end_date: a.end_date, office: a.office,
    officer_name: a.officer_name, violation_text: a.violation_text, status: "active"
  }, s, "Agreement activated");
}

/* ---- condition editor ---- */
function conditionDialog(s, a, c = {}) {
  closeModal();
  const wrap = document.createElement("div");
  wrap.id = "modal"; wrap.className = "modalwrap";
  wrap.innerHTML = `<div class="scrim"></div><div class="modal"></div>`;

/* ---------------- modals ----------------
   One shell, three bodies. Adding the next mini-feature is a new render
   function, not another dialog implementation. */

function closeModal() {
  const m = el("modal"); if (m) m.remove();
  document.removeEventListener("keydown", escClose);
  /* The transcript poll lives on the modal. Leaving it running against a
     screen nobody is looking at is how a page requests forever. */
  stopAiPoll();
}
function escClose(e) { if (e.key === "Escape") closeModal(); }

function openModal(kind, s) {

  wrap.id = "modal"; wrap.className = "modalwrap";

/**
 * A styled confirmation, resolving true/false. Replaces `confirm()`, which
 * this project does not use — it cannot be styled, cannot state a consequence
 * properly, and blocks the whole tab.
 */
function confirmModal({ title, body, confirmLabel = "Confirm", danger = true }) {
  return new Promise(resolve => {
    closeModal();
    const wrap = document.createElement("div");
    wrap.id = "modal"; wrap.className = "modalwrap";
    wrap.innerHTML = `<div class="scrim"></div><div class="modal"></div>`;
    document.body.appendChild(wrap);

    const done = v => { closeModal(); resolve(v); };
    wrap.querySelector(".scrim").onclick = () => done(false);
    wrap.querySelector(".modal").innerHTML = `
      ${head(esc(title))}
      <div class="mbody">
        <p style="margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)">${esc(body)}</p>
        <div class="mfoot">
          <button class="linkbtn" id="cm_no">Cancel</button>
          <button class="btn small${danger ? " danger" : ""}" id="cm_yes">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    el("cm_no").onclick = () => done(false);
    el("cm_yes").onclick = () => done(true);
    el("cm_yes").focus();

    // Esc cancels, matching every other modal here.
    const key = e => { if (e.key === "Escape") { document.removeEventListener("keydown", key); done(false); } };
    document.addEventListener("keydown", key);
  });
}

/**
 * A confirmation that also asks for one line of text, resolving the string or
 * null if cancelled. Replaces `prompt()`, which this project does not use for
 * the same reasons it does not use `confirm()`.
 *
 * Built beside confirmModal rather than inside it: the two differ in what they
 * resolve, and folding a text field into a yes/no dialog would leave every
 * caller checking whether the `true` it got back was really a string.
 */
function promptModal({ title, body, label = "Reason", placeholder = "",
                       confirmLabel = "Save", value = "" }) {
  return new Promise(resolve => {
    closeModal();
    const wrap = document.createElement("div");
    wrap.id = "modal"; wrap.className = "modalwrap";
    wrap.innerHTML = `<div class="scrim"></div><div class="modal"></div>`;
    document.body.appendChild(wrap);

    const done = v => { closeModal(); resolve(v); };
    wrap.querySelector(".scrim").onclick = () => done(null);
    wrap.querySelector(".modal").innerHTML = `
      ${head(esc(title))}
      <div class="mbody">
        ${body ? `<p style="margin:0 0 14px;font-size:14.5px;line-height:1.6;color:var(--ink-2)">${esc(body)}</p>` : ""}
        <label for="pm_v">${esc(label)}</label>
        <input id="pm_v" value="${esc(value)}" placeholder="${esc(placeholder)}">
        <div class="mfoot">
          <button class="linkbtn" id="pm_no">Cancel</button>
          <button class="btn small" id="pm_yes">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    el("pm_no").onclick = () => done(null);
    el("pm_yes").onclick = () => done(el("pm_v").value);
    el("pm_v").onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); done(el("pm_v").value); }
    };
    el("pm_v").focus();

    const key = e => {
      if (e.key === "Escape") { document.removeEventListener("keydown", key); done(null); }
    };
    document.addEventListener("keydown", key);
  });
}

/** A read-only modal for content that has no editor behind it. */
function showModal(title, sub, html) {

const head = (title, sub) => `
  <div class="mhead">
    <div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ""}</div>
    <button class="mclose" onclick="closeModal()" aria-label="Close">&times;</button>
  </div>`;

/* Which tile each endpoint belongs to, so a save can flash the right one and
   name itself in the confirmation. One table rather than a chain of
   `url.includes(...)` guesses that silently return null for anything added
   later — which is exactly how employment shipped with no feedback. */
const MODULE = {
  "/api/vehicles":          { tile: "vehicle", saved: "Vehicle saved" },
  "/api/vehicles/delete":   { tile: "vehicle", saved: "Vehicle removed" },
  "/api/curfew":            { tile: "curfew",  saved: "Curfew saved" },
  "/api/travel-permit":     { tile: "travel",  saved: "Travel permit saved" },
  "/api/employment":        { tile: "employ",  saved: "Employment saved" },
  "/api/obligations":       { tile: "service", saved: "Requirement saved" },
  "/api/obligations/delete":{ tile: "service", saved: "Requirement removed" },
  "/api/goals":             { tile: "goals",   saved: "Goal saved" },
  "/api/goals/complete":    { tile: "goals",   saved: "Goal updated" },
  "/api/goals/delete":      { tile: "goals",   saved: "Goal removed" },
  "/api/goals/step":        { tile: "goals",   saved: "Action step saved" },
  "/api/goals/step/delete": { tile: "goals",   saved: "Action step removed" },
  "/api/goals/step/done":   { tile: "goals",   saved: "Action step updated" },
  "/api/financial":         { tile: "financial", saved: "Obligation saved" },
  "/api/financial/delete":  { tile: "financial", saved: "Obligation removed" },
  "/api/financial/payment": { tile: "financial", saved: "Payment recorded" },
  "/api/financial/payment/delete": { tile: "financial", saved: "Payment removed" },
  "/api/financial/waive":   { tile: "financial", saved: "Obligation waived" },
  "/api/important-dates":        { tile: "dates", saved: "Appointment saved" },
  "/api/important-dates/delete": { tile: "dates", saved: "Appointment removed" },
  "/api/important-dates/close":  { tile: "dates", saved: "Outcome recorded" }
};

/* `close` for single-record editors — curfew, travel permit, employment —
   where a re-render looks identical to not having saved. List editors stay
   open so another row can be added.

   Either way the save is confirmed out loud. "It re-rendered and looked the
   same" is indistinguishable from "nothing happened", and that has been
   mistaken for a bug three times on this project. */
async function saveAndRefresh(url, payload, s, body, render, { close = false } = {}) {
  const mod = MODULE[url] || {};
  const btns = body.querySelectorAll("button");
  const saveBtn = body.querySelector('[id$="_save"]');
  const label = saveBtn?.textContent;
  btns.forEach(b => b.disabled = true);
  if (saveBtn) saveBtn.textContent = "Saving\u2026";
  try {
    const r = await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { toast(d.error || `Could not save (HTTP ${r.status})`, "err"); return false; }
    await loadDetail(s);
    if (close) {
      // Flag which tile changed so it can flash once the modal is gone.
      window.__savedTile = mod.tile || null;
      renderTiles(s);
      closeModal();
    } else render(body, s);
    toast(mod.saved || "Saved");
    return true;
  } catch (e) {
    // A silent failure is worse than an ugly one.
    toast("Couldn't reach the server — your change was NOT saved.", "err");
    return false;
  } finally {
    btns.forEach(b => b.disabled = false);
    if (saveBtn && label) saveBtn.textContent = label;
  }
}

/**
 * The officer's running record of a case.
 *
 * Append-only, and the modal says so. There is no edit and no delete because

async function paintCaseNotes(s, notes) {
  const box = el("cnBody"); if (!box) return;
  if (!notes) {
    try {
      notes = (await fetch(`/api/case-notes?subject_id=${encodeURIComponent(s.subject_id)}`)
                .then(r => r.json())).notes || [];
    } catch { box.innerHTML = `<div class="err">Couldn\u2019t load the notes.</div>`; return; }
  }

  box.className = "";
  box.innerHTML = `
    <label for="cn_body">New note</label>
    <textarea id="cn_body" rows="3"
      placeholder="What happened, what was decided, what you noticed"></textarea>
    <div id="cn_error"></div>
    <div class="mactions" style="margin-top:12px">
      <span class="hint" style="margin:0 auto 0 0">Notes cannot be edited once saved.</span>
      <button class="btn small" id="cn_save">Add note</button>
    </div>

    <h4 class="vdHead" style="margin-top:24px">
      ${notes.length} note${notes.length === 1 ? "" : "s"}</h4>
    ${notes.length
      ? `<div class="cnList">${notes.map(n => `
          <div class="vnote">${esc(n.body)}
            <span>${esc(n.author || "Unattributed")} &middot; ${esc(whenFull(n.created_at))}</span>
          </div>`).join("")}</div>`
      : `<p class="mempty">Nothing recorded yet.</p>`}`;

  el("cn_body").focus();
  el("cn_save").onclick = async () => {
    const body = el("cn_body").value.trim();
    if (!body) {
      el("cn_error").innerHTML = `<div class="err">Write something first.</div>`;
      el("cn_body").focus();
      return;
    }
    const btn = el("cn_save"); btn.disabled = true; btn.textContent = "Saving\u2026";
    try {
      const d = await api("/api/case-notes", { subject_id: s.subject_id, body });
      paintCaseNotes(s, d.notes);
      toast("Note added");
    } catch (e) {
      btn.disabled = false; btn.textContent = "Add note";
      el("cn_error").innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
    }
  };
}

    }
    const payload = {
      ...(s.subject_id ? { subject_id: s.subject_id } : {}),
      first_name: first, last_name: last,
      case_number: el("d_case").value.trim(), dob: el("d_dob").value || null,
      phone: el("d_phone").value.trim(), email: el("d_email").value.trim(),
      address_line1: el("d_addr1").value.trim(), address_line2: el("d_addr2").value.trim(),
      city: el("d_city").value.trim(), state: el("d_state").value,
      postal_code: el("d_zip").value.trim(),
      intake_date: el("d_intake").value || null, next_review: el("d_review").value || null
    };
    const btn = el("d_save"), label = btn.textContent;
    btn.disabled = true; btn.textContent = isNew ? "Creating…" : "Saving…";
    try {
      if (isNew) {
        /* Straight to the new profile. A create that drops you back on the
           roster makes you hunt for the person you just typed in, and the
           profile is where the modules they now need actually live. */
        const d = await api("/api/subjects", payload);
        SUBJECTS.push(d.subject);
        closeModal();
        toast(`${d.subject.name} added to your caseload`);
        location.hash = `/subject/${d.subject.subject_id}`;
        return;
      }
      const d = await api("/api/subject", payload);
      // The roster holds its own copy; update it so the card and the ring
      // do not disagree with the record that was just saved.
      const i = SUBJECTS.findIndex(x => x.subject_id === s.subject_id);
      if (i >= 0) SUBJECTS[i] = { ...SUBJECTS[i], ...d.subject };
      closeModal();
      route();
      toast("Details saved");
    } catch (e) {
      el("d_error").innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
      btn.disabled = false; btn.textContent = label;
    }
  };
}

/* ---- documents ---- */
/* ---------------- goals and action steps ----------------
   A goal is what the two of them are working towards; an action step is the
   concrete thing that gets somebody there. Progress comes from the steps and
   nobody types it in — but closing the goal is the officer's decision, which
   is why the button exists at all rather than the last tick doing it. */

const GOAL_STATE = {
  not_started:      ["Not started",       "at_risk"],
  in_progress:      ["In progress",       "in_progress"],
  awaiting_officer: ["Ready to close",    "needs_attention"],
  overdue:          ["Overdue",           "at_risk"],
  complete:         ["Complete",          "ready"],
  cancelled:        ["Cancelled",         "not_applicable"]
};

/**
 * Counts on the action-row buttons.
 *
 * These modules have no tile to carry a number, so it rides on the button.
 *
 * ONE rule for all three, and the same one the mobile badges use: **red while
 * something has not been started or has run past its date, amber once
 * everything outstanding is under way, hidden when there is nothing.** Each of
 * these had its own rule for a while, which is how Goals could show one open
 * goal in the quiet colour while Programs showed one unstarted course in red —
 * the same situation, two answers. Nobody should have to learn a colour
 * vocabulary per button.
 */
function paintCount(id, { n, urgent, tip }) {
  const b = el(id); if (!b) return;
  b.hidden = n === 0;
  if (!n) return;
  b.textContent = n;
  b.className = "btnCount " + (urgent ? "urgent" : "active");
  b.setAttribute("data-tip", tip);
}

function paintProgramCount() {
  const open = (DETAIL?.programs || [])
    .filter(p => p.completion_status !== "completed");
  const unstarted = open.filter(p =>
    !p.completion_status || p.completion_status === "not attempted").length;
  paintCount("programCount", {
    n: open.length, urgent: unstarted > 0,
    tip: unstarted ? `${open.length} assigned, ${unstarted} not started`
                   : `${open.length} in progress`
  });
}

function paintGoalCount() {
  const open = (DETAIL?.goals || []).filter(g => g.status === "open");
  const late = open.filter(g => g.overdue).length;
  const unstarted = open.filter(g => (g.progress?.done ?? 0) === 0).length;
  paintCount("goalCount", {
    n: open.length, urgent: late > 0 || unstarted > 0,
    tip: late ? `${open.length} open, ${late} overdue`
       : unstarted ? `${open.length} open, ${unstarted} not started`
       : `${open.length} under way`
  });
}

/**
 * Visits waiting on somebody.
 *
 * "Urgent" here is anything the officer has to act on: a request with no date,
 * a visit whose day has passed with no outcome, or one the subject has not
 * confirmed. A confirmed visit in the future is work scheduled, not work owed.
 */
function paintVisitCount() {
  const all = (DETAIL?.visits || [])
    .filter(v => v.status !== "completed" && v.status !== "cancelled");
  const requested = all.filter(v => v.status === "requested").length;
  const pastDue = all.filter(v =>
    v.scheduled_at && new Date(v.scheduled_at) < new Date()).length;
  const unconfirmed = all.filter(v => v.scheduled_at && !v.accepted_at).length;
  paintCount("visitCount", {
    n: all.length, urgent: requested > 0 || pastDue > 0 || unconfirmed > 0,
    tip: [requested ? `${requested} requested` : null,
          pastDue ? `${pastDue} past due` : null,
          unconfirmed ? `${unconfirmed} not confirmed` : null]
         .filter(Boolean).join(", ") || `${all.length} scheduled`
  });
}




/**
 * Goals — a full page, because a goal is worked over weeks.
 *
 * It was a modal, which was the wrong shape: a modal is for one decision and
 * then out, and this is a list somebody returns to, ticks things off in, and
 * adds to. The reentry plan learned the same lesson.
 *
 * Steps are edited inline on the card rather than behind a form. On a page
 * there is room for them, and "add the goal, then add its steps" is one piece
 * of work that should not need two screens.
 */
/* ================================================================
   Action Items — what came out of the visits.

   A full page rather than a modal, for the same reason Goals is one: this is a
   list somebody returns to and ticks things off, not one decision and out.

   Everything here began life as a machine's reading of a recording, and every
   row says whose it is and where it came from. Nothing arrives on this page
   until an officer has accepted it off a summary — a proposal nobody has
   looked at is not work anybody owes.
================================================================ */
let ACTIONS = [];

/* The badge on the Action Items button. Same rule as every other count in this
   file: red when something is overdue or unreviewed, amber while work is merely
   outstanding, hidden when there is nothing. */
async function paintActionCount(s) {
  let list = [];
  try {
    list = (await fetch(`/api/subject/actions?subject_id=${encodeURIComponent(s.subject_id)}`)
             .then(r => r.json())).actions || [];
  } catch { return; }
  const today = new Date().toISOString().slice(0, 10);
  const open = list.filter(a => a.status === "accepted");
  const waiting = list.filter(a => a.status === "proposed").length;
  const late = open.filter(a => a.due_date && a.due_date < today).length;
  paintCount("actionCount", {
    n: open.length + waiting,
    urgent: late > 0 || waiting > 0,
    tip: [late ? `${late} overdue` : "",
          waiting ? `${waiting} awaiting review` : "",
          open.length ? `${open.length} outstanding` : ""].filter(Boolean).join(" · ")
  });
}

async function renderActions(s) {
  view.innerHTML = `<div class="crumb"><a id="toRoster">Subjects</a> &nbsp;&rsaquo;&nbsp;
    <a id="toProfile">${esc(s.name)}</a> &nbsp;&rsaquo;&nbsp; Action Items</div>
    <p class="pagesub">Loading&hellip;</p>`;
  el("toRoster").onclick = () => { location.hash = "/subjects"; };
  el("toProfile").onclick = () => { location.hash = `/subject/${s.subject_id}`; };

  try {
    ACTIONS = (await fetch(`/api/subject/actions?subject_id=${encodeURIComponent(s.subject_id)}`)
                .then(r => r.json())).actions || [];
  } catch {
    view.innerHTML += `<div class="err">Couldn't load the action items.</div>`; return;
  }
  paintActions(s);
}

function paintActions(s) {
  const open = ACTIONS.filter(a => a.status === "accepted");
  const fromGoals = open.filter(a => a.kind === "goal_step").length;
  const done = ACTIONS.filter(a => a.status === "done");
  const dropped = ACTIONS.filter(a => a.status === "dismissed");
  const mine = open.filter(a => a.owner === "officer" || a.owner === "unclear").length;
  const theirs = open.length - mine;

  /* Who said it was done. Both are real and neither waits on the other — but
     "the subject told me they dropped the pay stub off" and "I have it" are
     different facts, and a list that cannot tell them apart cannot answer the
     question an officer actually asks. */
  const byThem = done.filter(a => (a.done_by || "") !== (a.officer || ""));
  const byMe = done.filter(a => (a.done_by || "") === (a.officer || ""));

  const today = new Date().toISOString().slice(0, 10);

  /* A checklist: tick it and it is done. The tick is the control, not a button
     labelled "Mark done" beside it — an officer working down a list wants one
     target per row, in the same place every time. */
  const row = a => `
    <div class="aiAct ${a.status === "done" ? "done" : a.status === "dismissed" ? "dropped" : ""}">
      <div class="aiActNo">
        ${a.status === "accepted"
          ? `<button class="aiTick" ${a.kind === "goal_step"
                       ? `data-stepdone="${a.id}"` : `data-done="${a.id}"`}
                     aria-label="Mark done" data-tip="Mark done">&check;</button>`
          : a.status === "done"
            ? `<span class="aiTick on">&check;</span>`
            : a.status === "dismissed" ? `<span>&times;</span>` : `<span>&middot;</span>`}
      </div>
      <div>
        ${a.kind === "goal_step" || a.status !== "accepted"
          ? `<div class="aiActBody">${esc(a.body)}</div>`
          : `<button class="aiActBody aiEditable" data-edit="${a.id}"
                     data-tip="Click to fix the wording">${esc(a.body)}</button>`}
        <div class="aiActMeta">
          ${a.kind === "goal_step"
            ? `<button class="aiSrc" data-goal="${a.source.id}"
                       data-tip="Open the goal this step belongs to"
                >Goal &middot; ${esc(a.source.title || "")}</button>`
            : ""}
          ${a.kind === "goal_step"
            ? `<span class="aiOwner">${esc(AI_OWNER[a.owner] || "Subject")}</span>`
            : a.status === "accepted"
            ? `<select class="aiOwner" data-owner="${a.id}">
                 ${["officer","subject","unclear"].map(o =>
                   `<option value="${o}"${a.owner === o ? " selected" : ""}>${
                     AI_OWNER[o]}</option>`).join("")}
               </select>`
            : `<span class="aiOwner">${esc(AI_OWNER[a.owner] || "Unclear")}</span>`}
          ${a.kind === "goal_step"
            ? (a.due_date
                ? `<span class="aiDue ${a.due_date < today ? "late" : ""}"
                     data-tip="The goal's date — change it on the goal"
                   >${esc(a.due_date)}</span>` : "")
            : a.status === "accepted"
            ? `<input type="date" class="aiDue ${
                 a.due_date && a.due_date < today ? "late" : ""}"
                 value="${esc(a.due_date || "")}" data-due="${a.id}"
                 data-tip="${a.due_hint
                   ? esc(`Said as "${a.due_hint}" — change it if that is not right`)
                   : "No date was spoken. Set one if it needs a deadline."}">`
            : a.due_date ? `<span class="aiDue">${esc(a.due_date)}</span>` : ""}
          ${a.due_hint ? `<span>&ldquo;${esc(a.due_hint)}&rdquo;</span>` : ""}
          ${a.quote ? "" : `<span>${esc(shortDate(a.scheduled_at) || "—")} visit</span>`}
          ${a.owner_proposed && a.owner_proposed !== a.owner
            ? `<span class="aiOwnerFixed">was <b>${
                 esc(AI_OWNER[a.owner_proposed] || a.owner_proposed)}</b></span>` : ""}
          ${a.body_proposed && a.body_proposed !== a.body
            ? `<span class="aiOwnerFixed" data-tip="${esc(a.body_proposed)}"
                 >wording <b>edited</b></span>` : ""}
          ${a.status === "done" ? `<span>Done by ${esc(a.done_by || "—")}
             &middot; ${esc(whenFull(a.done_at))}</span>` : ""}
          ${a.status === "dismissed" ? `<span>Removed by ${esc(a.decided_by || "—")}</span>` : ""}
        </div>
        ${a.quote ? `
          <div class="aiActQuote">
            <div class="aiQuoteFrom">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
              Heard on the recording of the
              <button class="linkish" data-visit="${a.visit_id}">${
                esc(shortDate(a.scheduled_at) || "")} visit</button>
            </div>
            &ldquo;${esc(a.quote)}&rdquo;
          </div>` : ""}
      </div>
      <div class="vrecAct">
        ${a.kind === "goal_step" ? ""
          : a.status === "accepted"
          ? `<button class="btn small ghost" data-drop="${a.id}"
                     data-tip="Remove — the recording did not actually say this">Remove</button>`
          : a.status === "dismissed"
            ? `<button class="btn small ghost" data-undrop="${a.id}">Put back</button>`
            : ""}
      </div>
    </div>`;

  view.innerHTML = `
    <div class="crumb"><a id="toRoster">Subjects</a> &nbsp;&rsaquo;&nbsp;
      <a id="toProfile">${esc(s.name)}</a> &nbsp;&rsaquo;&nbsp; Action Items</div>

    <div class="panel reHead">
      <div class="reScore">
        <div class="reDial" style="--pct:${
            Math.round(done.length / Math.max(1, done.length + open.length) * 100)}">
          <span>${open.length}<i>open</i></span>
        </div>
        ${mine
          ? `<div class="reGate">${mine} yours to do</div>`
          : `<div class="reGate ${open.length ? "" : "on"}">${
              open.length ? "All with the subject" : "Nothing outstanding"}</div>`}
      </div>
      <div class="reFacts">
        <div><dt>Yours to do</dt><dd class="${mine ? "warn" : ""}">${mine}</dd></div>
        <div><dt>With the subject</dt><dd>${theirs}</dd></div>
        <div><dt>Reported by them</dt><dd>${byThem.length}</dd></div>
        <div><dt>Closed by you</dt><dd>${byMe.length}</dd></div>
      </div>
    </div>

    ${open.length ? `<h4 class="vdHead">Outstanding</h4>
      <div class="panel" style="padding:4px 18px">${open.map(row).join("")}</div>` : ""}

    ${byThem.length ? `<h4 class="vdHead">Reported by the subject</h4>
      <div class="panel" style="padding:4px 18px">${byThem.map(row).join("")}</div>
      <p class="mnote">They told you these are done. Taken at their word &mdash;
        nothing here waits on you &mdash; but kept apart from the ones you closed
        yourself, because those are two different facts.</p>` : ""}

    ${byMe.length ? `<h4 class="vdHead">Closed by you</h4>
      <div class="panel" style="padding:4px 18px">${byMe.map(row).join("")}</div>` : ""}

    ${dropped.length ? `<h4 class="vdHead">Removed</h4>
      <div class="panel" style="padding:4px 18px">${dropped.map(row).join("")}</div>` : ""}

    ${ACTIONS.length ? "" : `<div class="panel"><p class="mempty">No action items yet.
      They come out of a visit summary, once a recording has been transcribed.</p></div>`}

    <p class="mnote">Everything ${esc(s.first_name || "they")} has to do, from both
      places it can come from: a step written into a goal, and a commitment picked
      out of a visit recording. Each still lives with whatever produced it &mdash;
      this screen only gathers them.<br><br>
      Commitments from a visit go straight on the list.
      Ownership is inferred &mdash; the transcript has no speaker labels &mdash; so
      change it on the row if it landed on the wrong person, and remove anything
      the recording did not actually say.</p>`;

  el("toRoster").onclick = () => { location.hash = "/subjects"; };
  el("toProfile").onclick = () => { location.hash = `/subject/${s.subject_id}`; };

  /* A goal step ticks through the goals endpoint, not the summary one. Same
     gesture on screen, two different records underneath — which is the point of
     merging them for reading only. */
  /* Swap the sentence for an input in place. Enter saves, Escape abandons,
     blur saves — the three things a person will try without being told. */
  view.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.edit), was = b.textContent;
    const input = document.createElement("input");
    input.className = "aiEditInput"; input.value = was;
    b.replaceWith(input);
    input.focus(); input.setSelectionRange(was.length, was.length);

    let settled = false;
    const finish = async (save) => {
      if (settled) return; settled = true;
      const next = input.value.trim();
      if (!save || !next || next === was) return renderActions(s);
      try {
        await api("/api/visits/summary/action", { id, body: next });
        toast("Wording corrected");
      } catch (e) { toast(e.message, "err"); }
      renderActions(s);
    };
    input.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    };
    input.onblur = () => finish(true);
  });

  view.querySelectorAll("[data-stepdone]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.classList.add("on");
    try {
      await api("/api/goals/step/done", { id: Number(b.dataset.stepdone), done: true });
      toast("Step marked done");
      renderActions(s);
    } catch (e) { toast(e.message, "err"); b.disabled = false; b.classList.remove("on"); }
  });

  view.querySelectorAll("[data-goal]").forEach(b => b.onclick = () => {
    location.hash = `/subject/${s.subject_id}/goals`;
  });

  view.querySelectorAll("[data-done]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.classList.add("on");
    try {
      await api("/api/visits/summary/action",
                { id: Number(b.dataset.done), status: "done" });
      toast("Marked done");
      renderActions(s);
    } catch (e) { toast(e.message, "err"); b.disabled = false; b.classList.remove("on"); }
  });

  /* The derived date is a suggestion. An officer who knows the real deadline
     overrides it, and clearing the field removes it — "not provided" and
     "explicitly cleared" have to be different things or a date can never be
     taken off. */
  view.querySelectorAll("[data-due]").forEach(inp => inp.onchange = async () => {
    try {
      await api("/api/visits/summary/action",
                { id: Number(inp.dataset.due), due_date: inp.value || null });
      toast(inp.value ? `Due ${inp.value}` : "Due date cleared");
      renderActions(s);
    } catch (e) { toast(e.message, "err"); }
  });

  const setStatus = (sel, status, msg) =>
    view.querySelectorAll(sel).forEach(b => b.onclick = async () => {
      b.disabled = true;
      try {
        await api("/api/visits/summary/action",
                  { id: Number(b.dataset.drop || b.dataset.undrop), status });
        toast(msg);
        renderActions(s);
      } catch (e) { toast(e.message, "err"); b.disabled = false; }
    });
  /* Reassigning from here rather than only on the visit. The record is the
     same either way — owner_proposed keeps what the model inferred, and
     owner_set_by/at record who overruled it — so making an officer navigate to
     the visit to do it would be ceremony that buys no evidence. The quote sits
     on this row too, which is the only thing the visit screen had that this
     one needed. */
  view.querySelectorAll("[data-owner]").forEach(sel => sel.onchange = async () => {
    sel.disabled = true;
    try {
      await api("/api/visits/summary/action",
                { id: Number(sel.dataset.owner), owner: sel.value });
      toast(sel.value === "unclear" ? "Marked as unclear"
                                    : `Reassigned to the ${sel.value}`);
      renderActions(s);
    } catch (e) { toast(e.message, "err"); sel.disabled = false; }
  });

  /* Straight to the visit — its player, its transcript — rather than the visits
     list. The point of naming the source is being able to go and check it. */
  view.querySelectorAll("[data-visit]").forEach(b => b.onclick = async () => {
    try {
      const d = await fetch(`/api/visits?subject_id=${encodeURIComponent(s.subject_id)}`)
                  .then(r => r.json());
      const v = (d.visits || []).find(x => x.id === Number(b.dataset.visit));
      if (v) showVisit(v, s); else toast("That visit is no longer on the record", "err");
    } catch { toast("Couldn't open that visit", "err"); }
  });

  setStatus("[data-drop]", "dismissed", "Removed from the list");
  setStatus("[data-undrop]", "accepted", "Put back on the list");
}

async function renderGoals(s) {
  view.innerHTML = `<div class="crumb"><a id="toRoster">Subjects</a> &nbsp;&rsaquo;&nbsp;
    <a id="toProfile">${esc(s.name)}</a> &nbsp;&rsaquo;&nbsp; Goals</div>
    <p class="pagesub">Loading&hellip;</p>`;
  el("toRoster").onclick = () => { location.hash = "/subjects"; };
  el("toProfile").onclick = () => { location.hash = `/subject/${s.subject_id}`; };

  try {
    GOALS = (await fetch(`/api/goals?subject_id=${encodeURIComponent(s.subject_id)}`)
              .then(r => r.json())).goals || [];
  } catch { view.innerHTML += `<div class="err">Couldn't load the goals.</div>`; return; }
  paintGoals(s);
}

let GOALS = [];

function paintGoals(s) {
  const open = GOALS.filter(g => g.status === "open");
  const closed = GOALS.filter(g => g.status !== "open");
  const late = open.filter(g => g.overdue).length;
  const waiting = open.filter(g => g.state === "awaiting_officer").length;
  const steps = GOALS.reduce((a, g) => ({ done: a.done + g.progress.done,
                                          total: a.total + g.progress.total }),
                             { done: 0, total: 0 });

  view.innerHTML = `
    <div class="crumb"><a id="toRoster">Subjects</a> &nbsp;&rsaquo;&nbsp;
      <a id="toProfile">${esc(s.name)}</a> &nbsp;&rsaquo;&nbsp; Goals</div>

    <div class="panel reHead">
      <div class="reScore">
        <div class="reDial" style="--pct:${steps.total ? Math.round(steps.done / steps.total * 100) : 0}">
          <span>${open.length}<i>open</i></span>
        </div>
        ${late
          ? `<div class="reGate">${late} overdue</div>`
          : waiting
            ? `<div class="reGate">${waiting} ready to close</div>`
            : `<div class="reGate ${open.length ? "" : "on"}">${
                open.length ? "On track" : "Nothing outstanding"}</div>`}
      </div>
      <div class="reFacts">
        <div><dt>Open</dt><dd>${open.length}</dd></div>
        <div><dt>Overdue</dt>
             <dd class="${late ? "warn" : ""}">${late}</dd></div>
        <div><dt>Ready to close</dt>
             <dd class="${waiting ? "warn" : ""}">${waiting}</dd></div>
        <div><dt>Completed</dt><dd>${closed.length}</dd></div>
        <div><dt>Action steps</dt>
             <dd>${steps.total ? `${steps.done} of ${steps.total} done` : "None yet"}</dd></div>
      </div>
      <div class="reActs">
        <button class="btn small" id="g_new">Add a goal</button>
      </div>
    </div>

    ${GOALS.length
      ? open.map(g => goalCard(g, s)).join("")
        + (closed.length
           ? `<h2 class="goalDivider">Completed</h2>` + closed.map(g => goalCard(g, s)).join("")
           : "")
      : `<div class="panel empty">
           <h2>No goals yet</h2>
           <p>A goal is what the two of you are working towards — obtain
              employment, secure housing. Action steps are the concrete things
              that get ${esc(s.first_name)} there, and ${esc(s.first_name)} ticks
              those off in their app.</p>
           <button class="btn" id="g_first">Add the first goal</button>
         </div>`}`;

  el("toRoster").onclick = () => { location.hash = "/subjects"; };
  el("toProfile").onclick = () => { location.hash = `/subject/${s.subject_id}`; };
  wireGoals(s);
}

function goalCard(g, s) {
  const [label, cls] = GOAL_STATE[g.state] || GOAL_STATE.not_started;
  const p = g.progress;
  const closed = g.status !== "open";
  return `
    <section class="panel goalPanel ${closed ? "closed" : ""}">
      <div class="goalTop">
        <div style="flex:1;min-width:0">
          <h2 class="goalTitle">${esc(g.title)}</h2>
          ${g.detail ? `<p class="goalDetail">${esc(g.detail)}</p>` : ""}
          <p class="goalMeta">
            ${g.due_date
              ? `<span class="${g.overdue ? "goalLate" : ""}">${
                  g.overdue ? "Was due" : "Due"} ${esc(longDate(g.due_date))}</span>`
              : "No due date"}
            ${p.total ? ` &middot; ${p.done} of ${p.total} steps` : " &middot; no action steps yet"}
            ${g.completed_at
              ? ` &middot; closed ${esc(longDate(g.completed_at.slice(0, 10)))} by ${
                  esc(g.completed_by || "the officer")}` : ""}
          </p>
        </div>
        <span class="reStat ${cls}">${label}</span>
      </div>

      ${p.total ? `<div class="goalBar"><span style="width:${p.percent}%"></span></div>` : ""}

      <div class="goalSteps">
        ${(g.steps || []).map(st => `
          <div class="goalStep">
            <button class="goalTick ${st.done_at ? "on" : ""}"
                    data-step-done="${st.id}" data-done="${st.done_at ? "0" : "1"}"
                    data-tip="${st.done_at ? "Mark not done" : "Mark done"}"
                    ${closed ? "disabled" : ""}>${st.done_at ? "&#10003;" : ""}</button>
            <span class="${st.done_at ? "goalStepDone" : ""}">${esc(st.body)}</span>
            ${st.done_at ? `<span class="reBy">${esc(st.done_by || "")}</span>` : ""}
            ${closed ? "" : `<button class="linkbtn danger" data-del-step="${st.id}"
                              data-tip="Remove this step">&times;</button>`}
          </div>`).join("")}

        ${closed ? "" : `
          <div class="goalAdd">
            <input id="g_step_${g.id}" placeholder="Add an action step — e.g. Submit 10 resumes per week">
            <button class="btn small ghost" data-add-step="${g.id}">Add</button>
          </div>`}
      </div>

      <div class="goalActs">
        <button class="linkbtn" data-edit-goal="${g.id}">Edit goal</button>
        ${closed
          ? `<button class="linkbtn" data-close-goal="${g.id}" data-reopen="1">Reopen</button>`
          : `<button class="btn small" data-close-goal="${g.id}">Mark complete</button>`}
        <button class="linkbtn danger" data-del-goal="${g.id}">Remove</button>
      </div>
    </section>`;
}

function wireGoals(s) {
  const reload = () => renderGoals(s);
  const post = async (url, payload, okMsg) => {
    try {
      await api(url, payload);
      toast(okMsg);
      await reload();
      return true;
    } catch (e) { toast(e.message, "err"); return false; }
  };

  if (el("g_new"))   el("g_new").onclick = () => goalModal(s, {});
  if (el("g_first")) el("g_first").onclick = () => goalModal(s, {});

  view.querySelectorAll("[data-edit-goal]").forEach(b => b.onclick = () =>
    goalModal(s, GOALS.find(g => g.id === Number(b.dataset.editGoal))));

  view.querySelectorAll("[data-step-done]").forEach(b => b.onclick = () =>
    post("/api/goals/step/done",
         { id: Number(b.dataset.stepDone), done: b.dataset.done === "1" },
         b.dataset.done === "1" ? "Step marked done" : "Step reopened"));

  view.querySelectorAll("[data-del-step]").forEach(b => b.onclick = () =>
    post("/api/goals/step/delete", { id: Number(b.dataset.delStep) }, "Action step removed"));

  /* Steps come in threes and fours, so the input stays put and Enter adds —
     typing a list and reaching for the mouse between each line is not how
     anybody writes a list. */
  view.querySelectorAll("[data-add-step]").forEach(b => {
    const id = Number(b.dataset.addStep);
    const add = async () => {
      const input = el(`g_step_${id}`);
      const body = input.value.trim();
      if (!body) return toast("An action step cannot be empty.", "err");
      if (await post("/api/goals/step", { goal_id: id, body }, "Action step added"))
        el(`g_step_${id}`)?.focus();
    };
    b.onclick = add;
    el(`g_step_${id}`).onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); add(); }
    };
  });

  view.querySelectorAll("[data-close-goal]").forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.closeGoal), reopen = b.dataset.reopen === "1";
    const g = GOALS.find(x => x.id === id);
    if (!reopen) {
      const yes = await confirmModal({
        title: "Mark this goal complete?",
        body: `"${g.title}" will close. ${s.first_name} keeps a record of it and `
            + `can no longer tick its steps, and you can reopen it later.`,
        confirmLabel: "Mark complete", danger: false });
      if (!yes) return;
    }
    post("/api/goals/complete", { id, complete: !reopen },
         reopen ? "Goal reopened" : "Goal marked complete");
  });

  view.querySelectorAll("[data-del-goal]").forEach(b => b.onclick = async () => {
    const g = GOALS.find(x => x.id === Number(b.dataset.delGoal));
    const yes = await confirmModal({
      title: `Remove "${g.title}"?`,
      body: "The goal and its action steps are removed from the record. This "
          + "cannot be undone.",
      confirmLabel: "Remove goal" });
    if (!yes) return;
    post("/api/goals/delete", { id: g.id }, "Goal removed");
  });
}

/* The goal itself — title, why, when by. Its steps are added on the card,
   where there is room for them. */
function goalModal(s, g) {
  showModal(g.id ? "Edit goal" : "Add a goal", `${s.name} — ${s.case_number}`, `
    <label for="g_title">Goal</label>
    <input id="g_title" value="${esc(g.title || "")}" placeholder="e.g. Obtain employment">

    <label for="g_detail">Detail <span class="opt">(optional)</span></label>
    <input id="g_detail" value="${esc(g.detail || "")}"
           placeholder="What this is for, in a sentence">

    <label for="g_due">Due date <span class="opt">(optional)</span></label>
    <input type="date" id="g_due" value="${esc(g.due_date || "")}">

    ${g.id ? "" : `<p class="mnote">Action steps are added to the goal once it exists —
       you will land on it with the cursor ready.</p>`}
    ${reFoot(g.id ? "Save goal" : "Add goal", "g_save")}`);

  el("g_title").focus();
  const submit = async () => {
    const title = el("g_title").value.trim();
    if (!title) return toast("A goal needs a title.", "err");
    const before = new Set(GOALS.map(x => x.id));
    try {
      await api("/api/goals", { id: g.id, subject_id: s.subject_id, title,
        detail: el("g_detail").value.trim() || null,
        due_date: el("g_due").value || null });
    } catch (e) { return toast(e.message, "err"); }
    closeModal();
    toast(g.id ? "Goal saved" : "Goal added");
    await renderGoals(s);
    // Land on the new goal with the cursor where its first step goes.
    if (!g.id) {
      const made = GOALS.find(x => !before.has(x.id));
      if (made) el(`g_step_${made.id}`)?.focus();
    }
  };
  el("g_save").onclick = submit;
  el("g_title").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
}

/* ---------------- financial balance ----------------
   Amounts are cents on the wire and cents in the database; this is the only
   place they become a string, so a total cannot be formatted two ways on two
   screens. */
const money = c => (c < 0 ? "-" : "") + "$" +
  (Math.abs(c || 0) / 100).toLocaleString("en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const FIN_STATE = {
  outstanding: ["Outstanding", "in_progress"],
  part_paid:   ["Part paid",   "in_progress"],
  overdue:     ["Overdue",     "at_risk"],
  paid:        ["Paid",        "ready"],
  waived:      ["Waived",      "not_applicable"]
};

function renderFinancial(body, s, editing = null) {
  const fin = DETAIL?.financial || { items: [], totals: {} };
  const t = fin.totals || {};

  body.innerHTML = head("Financial Balance", esc(s.name)) + `
    <div class="mbody">
      ${editing ? finForm(editing) : `
        <div class="finTotals">
          <div><dt>Total due</dt><dd class="finBig">${money(t.balance_cents)}</dd></div>
          <div><dt>Imposed</dt><dd>${money(t.owed_cents)}</dd></div>
          <div><dt>Paid</dt><dd>${money(t.paid_cents)}</dd></div>
          ${t.waived_cents ? `<div><dt>Waived</dt><dd>${money(t.waived_cents)}</dd></div>` : ""}
          <div><dt>Overdue</dt>
               <dd class="${t.overdue_cents ? "finLate" : ""}">${money(t.overdue_cents)}</dd></div>
          <div><dt>Next due</dt><dd>${t.next_due ? esc(longDate(t.next_due)) : "—"}</dd></div>
        </div>

        <div class="cnList">
          ${fin.items.length ? fin.items.map(finRow).join("")
            : `<p class="muted">Nothing owed.</p>`}
        </div>
        <div class="mactions" style="margin-top:14px">
          <button class="btn small" id="f_new">Add an obligation</button>
        </div>`}
    </div>`;

  if (editing) return wireFinForm(body, s, editing);

  el("f_new").onclick = () => renderFinancial(body, s, {});

  body.querySelectorAll("[data-edit-fin]").forEach(b => b.onclick = () =>
    renderFinancial(body, s, fin.items.find(i => i.id === Number(b.dataset.editFin))));

  body.querySelectorAll("[data-pay]").forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.pay);
    const amount = el(`f_amt_${id}`).value.trim();
    if (!amount) return toast("Enter a payment amount.", "err");
    await saveAndRefresh("/api/financial/payment",
      { item_id: id, amount, paid_on: el(`f_on_${id}`).value || null,
        method: el(`f_via_${id}`).value.trim() || null },
      s, body, (bd, sj) => renderFinancial(bd, sj));
  });

  body.querySelectorAll("[data-del-pay]").forEach(b => b.onclick = async () => {
    const yes = await confirmModal({
      title: "Remove this payment?",
      body: "It comes off the balance and out of the payment history. Do this "
          + "only if it was entered by mistake.",
      confirmLabel: "Remove payment" });
    openModal("financial", s);
    if (!yes) return;
    await saveAndRefresh("/api/financial/payment/delete", { id: Number(b.dataset.delPay) },
      s, el("modal").querySelector(".modal"), (bd, sj) => renderFinancial(bd, sj));
  });

  body.querySelectorAll("[data-waive]").forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.waive), un = b.dataset.unwaive === "1";
    if (un) {
      return saveAndRefresh("/api/financial/waive", { id, waive: false },
        s, body, (bd, sj) => renderFinancial(bd, sj));
    }
    const note = await promptModal({
      title: "Waive this obligation?",
      body: "Waiving is not paying, and the record keeps them apart. Say why — "
          + "it stays on the case file.",
      label: "Reason", placeholder: "e.g. Waived by the court on 12 August",
      confirmLabel: "Waive" });
    openModal("financial", s);
    if (note === null) return;
    if (!note.trim()) return toast("Say why this is being waived.", "err");
    await saveAndRefresh("/api/financial/waive", { id, note },
      s, el("modal").querySelector(".modal"), (bd, sj) => renderFinancial(bd, sj));
  });

  body.querySelectorAll("[data-del-fin]").forEach(b => b.onclick = async () => {
    const i = fin.items.find(x => x.id === Number(b.dataset.delFin));
    const yes = await confirmModal({

/* ---------------- important dates ----------------
   Appointments the subject attends elsewhere. The three states the module
   exists for are unacknowledged, confirmed, and past-with-nothing-recorded —
   the last being the one an officer has to chase. */
/* The lifecycle, and separately whether the day has passed. Keeping them
   apart is what lets a row say "Accepted · awaiting outcome" — an appointment
   they agreed to and then went quiet about, which is a different conversation
   from one they never looked at. */
const DATE_STATE = {
  assigned:  ["Assigned",  "at_risk"],
  viewed:    ["Viewed",    "needs_attention"],
  accepted:  ["Accepted",  "ready"],
  completed: ["Completed", "ready"],
  missed:    ["Missed",    "at_risk"],
  cancelled: ["Cancelled", "not_applicable"]
};

const DATE_KINDS_FALLBACK = [["parole_board","Parole board hearing"],
  ["court","Court hearing"],["review_hearing","Probation review hearing"],
  ["treatment","Treatment or counselling session"],["drug_test","Drug test"],
  ["medical","Medical appointment"],["program","Program or class session"],
  ["community_svc","Community service shift"],
  ["employment","Employment interview or appointment"],
  ["benefits","Benefits or social services appointment"],
  ["identification","Identification or DMV appointment"],
  ["registration","Registration requirement"],
  ["housing","Housing appointment or inspection"],["other","Other"]];

function renderDates(body, s, editing = null) {
  const block = DETAIL?.important_dates || { dates: [], summary: {} };
  const open = block.dates.filter(d => d.status === "scheduled");
  const closed = block.dates.filter(d => d.status !== "scheduled");

  body.innerHTML = head("Important Dates", esc(s.name)) + `
    <div class="mbody">
      ${editing ? dateForm(editing) : `
        <p class="hint">Hearings, court dates and appointments the subject attends
           elsewhere. Officer visits are scheduled on the Visits screen.</p>
        <div class="cnList">
          ${open.length ? open.map(dateRow).join("")
            : `<p class="muted">Nothing scheduled.</p>`}
          ${closed.length ? `<h4 class="vdHead" style="margin-top:18px">Past</h4>`
            + closed.map(dateRow).join("") : ""}
        </div>
        <div class="mactions" style="margin-top:14px">
          <button class="btn small" id="d_new">Add an appointment</button>
        </div>`}
    </div>`;

  if (editing) return wireDateForm(body, s, editing);

  el("d_new").onclick = () => renderDates(body, s, {});

  body.querySelectorAll("[data-edit-date]").forEach(b => b.onclick = () =>
    renderDates(body, s, block.dates.find(d => d.id === Number(b.dataset.editDate))));

  body.querySelectorAll("[data-close-date]").forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.closeDate), status = b.dataset.status;
    if (status === "scheduled")
      return saveAndRefresh("/api/important-dates/close", { id, status },
        s, body, (bd, sj) => renderDates(bd, sj));
    const note = await promptModal({
      title: status === "completed" ? "Record attendance" : "Record a missed appointment",
      body: status === "completed"
        ? "What came of it, if anything. This goes on the case file."
        : "What is known about why it was missed. A missed appointment stays on "
          + "the record — it is not deleted.",
      label: "Note", placeholder: status === "completed"
        ? "e.g. Attended; decision in 30 days" : "e.g. Court confirmed no appearance",
      confirmLabel: status === "completed" ? "Record as attended" : "Record as missed" });
    openModal("dates", s);
    if (note === null) return;
    await saveAndRefresh("/api/important-dates/close", { id, status, note: note || null },
      s, el("modal").querySelector(".modal"), (bd, sj) => renderDates(bd, sj));
  });

  body.querySelectorAll("[data-del-date]").forEach(b => b.onclick = async () => {
    const d = block.dates.find(x => x.id === Number(b.dataset.delDate));
    const yes = await confirmModal({
      title: `Remove this ${esc(d.kind_label.toLowerCase())}?`,
      body: "It disappears from the subject's app and from the record. If it "
          + "happened and they did not attend, record it as missed instead.",
      confirmLabel: "Remove" });
    openModal("dates", s);
    if (!yes) return;
    await saveAndRefresh("/api/important-dates/delete", { id: d.id },
      s, el("modal").querySelector(".modal"), (bd, sj) => renderDates(bd, sj));
  });
}

function dateRow(d) {
  const [label, cls] = DATE_STATE[d.state] || DATE_STATE.assigned;
