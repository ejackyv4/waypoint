/* ---- community service ---- */
const TRAVEL = [["none","None"],["local","Local only"],
                ["interstate","Interstate"],["international","International"]];
const travelLabel = v => (TRAVEL.find(x => x[0] === v) || TRAVEL[0])[1];
/** "1991-04-17" → "April 17, 1991". Parsed as local midday so a timezone
 *  behind UTC cannot roll it back a day. */
/** "1 Sep" — for a provenance note, where the year is noise. Takes either a
 *  date or a full timestamp, since visits carry the latter. */
const shortDate = d => {
  if (!d) return "";
  const t = new Date(String(d).length <= 10 ? d + "T12:00:00" : d);
  return Number.isNaN(+t) ? String(d).slice(0, 10)
    : t.toLocaleDateString("en-US", { month: "short", day: "numeric" });
};

const longDate = d => {
  if (!d) return "";
  const t = new Date(d + "T12:00:00");
  return Number.isNaN(+t) ? d
    : t.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
};

/** Whole years, counting whether this year's birthday has happened yet. */
function ageFrom(d) {
  if (!d) return null;
  const b = new Date(d + "T12:00:00"), now = new Date();
  if (Number.isNaN(+b) || b > now) return null;
  let a = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) a--;
  return a;
}

/** A birth date reads as the date and the age together — the age is what an
 *  officer is actually checking, and making them work it out invites errors. */
const dobLine = d => {
  if (!d) return "—";
  const a = ageFrom(d);
  return longDate(d) + (a === null ? "" : ` (${a})`);
};

const asDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined,
  { month:"numeric", day:"numeric", year:"numeric" }) : "";
/* An expired permit is not a permit — say so rather than showing a level
   that no longer applies. */
const isExpired = t => !!(t?.expires_on && new Date(t.expires_on + "T23:59:59") < new Date());

const CS_STATUS = [["todo","To do"],["in_progress","In progress"],["complete","Complete"]];
const csLabel = v => (CS_STATUS.find(x => x[0] === v) || CS_STATUS[0])[1];
const csClass = v => v === "complete" ? "ok" : v === "in_progress" ? "go" : "muted";

function renderService(body, s, editing = null) {
  const list = DETAIL?.community_service || [];
  const e = editing === null ? null : (list.find(o => o.id === editing) || {});

  body.innerHTML = head("Community Service", esc(s.name)) + `
    <div class="mbody">
      ${list.length ? `<div class="mlist">${list.map(o => `
        <div class="mrow">
          <div>
            <div class="mrow-t">${esc(o.title)}</div>
            <div class="mrow-s">${o.required_quantity ? `${o.required_quantity} hours` : "No hours set"}</div>
          </div>
          <div class="mrow-a">
            <span class="pill ${csClass(o.status)}">${csLabel(o.status)}</span>
            <button class="linkbtn done" data-edit="${o.id}">Edit</button>
            <button class="linkbtn" data-del="${o.id}">Remove</button>
          </div>
        </div>`).join("")}</div>` : `<p class="mempty">Nothing assigned.</p>`}

      ${e ? `
        <div class="mform">
          <label>Title</label>
          <input id="o_title" value="${esc(e.title || "")}" placeholder="e.g. Riverside Park clean-up">
          <div class="frow">
            <div><label>Hours required</label>
              <input id="o_hours" type="number" min="0" step="0.5"
                     value="${e.required_quantity ?? ""}" placeholder="40"></div>
            <div><label>Status</label>
              <select id="o_status">${CS_STATUS.map(([v, l]) =>
                `<option value="${v}"${(e.status || "todo") === v ? " selected" : ""}>${l}</option>`).join("")}</select></div>
          </div>
          <div class="mactions">
            <button class="linkbtn" id="o_cancel">Cancel</button>
            <button class="btn small" id="o_save">${e.id ? "Save changes" : "Add requirement"}</button>
          </div>
        </div>`
      : `<button class="btn small addbtn" id="o_add">Add a requirement</button>`}
    </div>`;

  body.querySelectorAll("[data-edit]").forEach(b =>
    b.onclick = () => renderService(body, s, Number(b.dataset.edit)));
  body.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const o = list.find(x => x.id === Number(b.dataset.del));
    const yes = await confirmModal({
      title: "Remove this requirement?",
      body: `${o?.title || "This requirement"} will be removed, along with any hours `
          + "recorded against it.",
      confirmLabel: "Remove requirement" });
    if (yes) await saveAndRefresh("/api/obligations/delete", { id: Number(b.dataset.del) },
                                  s, body, renderService);
  });
  const add = el("o_add"); if (add) add.onclick = () => renderService(body, s, 0);
  const cancel = el("o_cancel"); if (cancel) cancel.onclick = () => renderService(body, s);
  const save = el("o_save");
  if (save) save.onclick = () => {
    const title = el("o_title").value.trim();
    if (!title) { toast("Give the requirement a title.", "err"); el("o_title").focus(); return; }
    saveAndRefresh("/api/obligations", {
      id: e.id || undefined, subject_id: s.subject_id, kind: "community_service",
      title, required_quantity: el("o_hours").value ? Number(el("o_hours").value) : null,
      unit: "hours", status: el("o_status").value
    }, s, body, renderService);
  };
}

/* ---------------- credentials panel ---------------- */
function clearCreds() {
  const c = el("creds"); if (c) c.innerHTML = "";
}

function showCreds(name, c) {
  const box = el("creds"); if (!box) return;
  box.innerHTML = `
    <div class="creds">
      <h3>Login created for ${esc(name)}</h3>
      <p>Shown once &mdash; hand these to the subject.</p>
      <dl>
        <dt>Email</dt><dd>${esc(c.login)}</dd>
        <dt>Password</dt><dd>${esc(c.password)}</dd>
      </dl>
      <a class="go" href="${WAYPOINT_LEARNER}" target="_blank">Open the learner site &nearr;</a>
      <button class="dismiss" onclick="clearCreds()">Dismiss</button>
    </div>`;
}

/* ---------------- live data ---------------- */
async function refresh(s) {
  try {
    const res0 = await fetch("/api/enrollments");
    if (res0.status === 401) return showSignIn("Your session expired. Please sign in again.");
    const d = await res0.json();
    const rows = (d.enrollments || []).filter(e => e.subject_id === s.subject_id);
    const body = el("enrol"); if (!body) return;

    body.innerHTML = rows.length ? rows.map(e => {
      const done = e.completion_status === "completed";
      const passed = e.success_status === "passed", failed = e.success_status === "failed";
      const started = e.completion_status && e.completion_status !== "not attempted";
      const label = done ? (passed ? "Completed · Passed" : failed ? "Completed · Not passed" : "Completed")
                  : started ? (e.exit_mode === "suspend" ? "In progress · saved" : "In progress")
                  : "Not started";
      const cls = done ? (failed ? "err" : "ok") : started ? "go" : "muted";
      return `<tr>
        <td>${esc(e.title)}</td>
        <td><span class="pill ${cls}">${label}</span>${
            e.attempt ? `<div class="mono">attempt ${e.attempt}</div>` : ""}</td>
        <td>${e.score_raw != null ? `${e.score_raw}${e.score_max != null ? ` / ${e.score_max}` : ""}` : "—"}</td>
        <td class="mono">${e.total_seconds ? dur(e.total_seconds) : "—"}</td>
        <td class="mono">${when(e.last_write_at || e.assigned_at)}</td>
        <td>${started
          ? (e.scorm_version === "xAPI" && e.registration_id
              ? `<button class="linkbtn" data-responses="${e.registration_id}">Review responses</button>`
              : `<span class="mono" style="color:var(--faint)">—</span>`)
          : `<button class="linkbtn" data-cancel-prog="${esc(e.program_id)}">Cancel</button>`}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="6" class="empty">Nothing assigned yet.</td></tr>`;

    // Only offered while untouched. The server enforces the same rule.
    body.querySelectorAll("[data-cancel-prog]").forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = "Cancelling…";
      try {
        const r = await fetch("/api/unassign", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject_id: s.subject_id, program_id: b.dataset.cancelProg })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        toast("Assignment cancelled");
        refresh(s);
      } catch (e) {
        // This used to write into the assign panel's error box, which is gone
        // now the form is a modal — and the `if (box)` guard meant a failed
        // cancellation would simply have shown nothing at all.
        toast(String(e.message || e), "err");
        b.disabled = false; b.textContent = "Cancel";
      }
    });

    body.querySelectorAll("[data-responses]").forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = "Loading…";
      try {
        const r = await fetch(`/api/program-responses?registration_id=${encodeURIComponent(b.dataset.responses)}`);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        const answers = d.responses || [];
        b.disabled = false; b.textContent = "Review responses";
        const groups = [];
        const byContext = new Map();
        answers.forEach(a => {
          const key = `${a.section || ""}\u0000${a.lesson || ""}`;
          if (!byContext.has(key)) { const g = { section: a.section, lesson: a.lesson, answers: [] }; byContext.set(key, g); groups.push(g); }
          byContext.get(key).answers.push(a);
        });
        const transcript = groups.map(g => `<div style="margin-bottom:24px">
            ${g.section ? `<h3 style="margin:0 0 4px">${esc(g.section)}</h3>` : ""}
            ${g.lesson ? `<div class="hint" style="margin-bottom:12px">${esc(g.lesson)}</div>` : ""}
            ${g.answers.map(a => `<section style="margin-bottom:20px">
                <div class="hint">${esc(a.question)}</div>
                ${a.quality_flags?.length ? `<div class="pill muted" style="display:inline-block;margin-top:6px">Review: ${esc(a.quality_flags.join(", "))}</div>` : ""}
                <div style="margin-top:6px;white-space:pre-wrap">${esc(typeof a.response === "object" ? JSON.stringify(a.response) : (a.response ?? "No response"))}</div>
                <div class="mono" style="margin-top:6px;color:var(--faint)">${when(a.submitted_at)}</div>
              </section>`).join("")}
          </div>`).join("");
        showModal("Survey responses", `${s.name} — ${answers.length} submitted`, `<div style="margin-bottom:18px"><button class="btn small" id="exportResponses">Export PDF</button> <button class="btn small" id="analyzeResponses">Analyze with AI</button><span id="analysisStatus" class="aiNote" style="margin-left:8px"></span></div>` + (answers.length
          ? transcript
          : `<p class="empty">No survey responses have been received for this attempt.</p>`));
        el("exportResponses").onclick = async () => {
          const x = el("exportResponses"); x.disabled = true; x.textContent = "Creating PDF…";
          try {
            const pdf = await fetch("/api/program-responses/pdf", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ registration_id: b.dataset.responses })
            });
            const out = await pdf.json();
            if (!pdf.ok) throw new Error(out.error || `HTTP ${pdf.status}`);
            window.open(`/documents/${out.document.id}`, "_blank", "noopener");
            toast("Survey responses PDF exported");
            x.disabled = false; x.textContent = "Export PDF";
          } catch (e) { toast(String(e.message || e), "err"); x.disabled = false; x.textContent = "Export PDF"; }
        };
        el("analyzeResponses").onclick = async () => {
          const x = el("analyzeResponses"), status = el("analysisStatus");
          x.disabled = true; x.textContent = "Queuing…";
          try {
            const started = await fetch("/api/program-analysis", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ registration_id: b.dataset.responses })
            });
            const out = await started.json();
            if (!started.ok) throw new Error(out.error || `HTTP ${started.status}`);
            status.textContent = out.provider_ready ? "Running…" : "Provider disabled";
            const poll = async () => {
              const p = await fetch(`/api/program-analysis/${out.job.id}`).then(r => r.json());
              if (p.job?.status === "draft") {
                status.innerHTML = `<button class="linkbtn" id="viewAnalysisDraft">View draft</button>`;
                el("viewAnalysisDraft").onclick = () => {
                  let result = {};
                  try { result = JSON.parse(p.job.result_json || "{}"); } catch {}
                  const body = `<div class="aiWarn"><span>&#9888;</span><span>AI-assisted draft. Review the original responses before relying on this analysis.</span></div>
                    ${result.headline ? `<h3>${esc(result.headline)}</h3>` : ""}
                    <h4>What was found</h4>${Array.isArray(result.findings) && result.findings.length ? result.findings.map(f => `<p>${esc(f.text || "")}<br><span class="hint">Evidence: “${esc(f.evidence || "") }” · ${esc(f.confidence || "unknown")} confidence</span></p>`).join("") : `<div class="aiText">No findings returned.</div>`}
                    ${Array.isArray(result.response_quality_flags) && result.response_quality_flags.length ? `<h4>Response quality</h4>${result.response_quality_flags.map(f => `<p><b>${esc(f.category || "Review")}:</b> ${esc(f.evidence || "")}</p>`).join("")}` : ""}
                    ${Array.isArray(result.danger_signs) && result.danger_signs.length ? `<h4>Danger-sign review</h4>${result.danger_signs.map(f => `<p><b>${esc(f.severity || "Review")} · ${esc(f.category || "Signal")}:</b> ${esc(f.evidence || "")}<br><span class="hint">${esc(f.uncertainty || "")}</span></p>`).join("")}` : `<p class="hint">No danger signs were returned.</p>`}
                    ${Array.isArray(result.follow_up_questions) && result.follow_up_questions.length ? `<h4>Suggested follow-up</h4>${result.follow_up_questions.map(q => `<p>${esc(q)}</p>`).join("")}` : ""}
                    <p class="aiNote">Draft ${esc(p.job.id)} · ${esc(p.job.model || "configured provider")} · ${esc(p.job.prompt_version || "phase2-v1")}</p>
                    <hr><h4>Officer review</h4><select id="analysisDisposition"><option value="approved">Approve</option><option value="edited">Approve with edits</option><option value="escalated">Escalate for further review</option><option value="dismissed">Dismiss draft</option></select>
                    <textarea id="analysisNotes" placeholder="Review notes" style="width:100%;min-height:70px;margin-top:8px"></textarea>
                    <div style="margin-top:10px"><button class="btn small" id="saveAnalysisReview">Save review</button> <button class="btn small" id="exportAnalysisPdf" disabled>Export reviewed PDF</button><span id="reviewStatus" class="aiNote" style="margin-left:8px"></span></div>`;
                  showModal("Program Completion Summary — Draft", `${s.name} · ${answers.length} responses`, body);
                  el("saveAnalysisReview").onclick = async () => {
                    const save = el("saveAnalysisReview"), status = el("reviewStatus"); save.disabled = true; save.textContent = "Saving…";
                    try {
                      const rr = await fetch("/api/program-analysis/review", { method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ analysis_id: p.job.id, disposition: el("analysisDisposition").value, notes: el("analysisNotes").value }) });
                      const out = await rr.json(); if (!rr.ok) throw new Error(out.error || `HTTP ${rr.status}`);
                      status.textContent = "Review saved"; el("exportAnalysisPdf").disabled = out.review.disposition === "dismissed";
                    } catch (e) { status.textContent = String(e.message || e); } finally { save.disabled = false; save.textContent = "Save review"; }
                  };
                  el("exportAnalysisPdf").onclick = async () => {
                    const x = el("exportAnalysisPdf"), status = el("reviewStatus"); x.disabled = true; x.textContent = "Creating PDF…";
                    try {
                      const rr = await fetch("/api/program-analysis/pdf", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ analysis_id: p.job.id }) });
                      const out = await rr.json(); if (!rr.ok) throw new Error(out.error || `HTTP ${rr.status}`);
                      window.open(`/documents/${out.document.id}`, "_blank", "noopener"); status.textContent = "PDF exported";
                    } catch (e) { status.textContent = String(e.message || e); } finally { x.disabled = false; x.textContent = "Export reviewed PDF"; }
                  };
                };
                x.textContent = "Analyze again"; x.disabled = false; return;
              }
              if (p.job?.status === "failed") { status.textContent = `Failed: ${p.job.error || "unknown error"}`; x.textContent = "Try again"; x.disabled = false; return; }
              setTimeout(poll, 1000);
            };
            poll();
          } catch (e) { status.textContent = String(e.message || e); x.disabled = false; x.textContent = "Analyze with AI"; }
        };
      } catch (e) {
        toast(String(e.message || e), "err");
        b.disabled = false; b.textContent = "Review responses";
      }
    });

  } catch {}

  try {
    const d = await fetch("/api/results").then(r => r.json());
    const rows = (d.results || []).filter(r => r.subject_id === s.subject_id);
    const body = el("results"); if (!body) return;
    body.innerHTML = rows.length ? rows.map(x => {
      const p = JSON.parse(x.payload);
      const passed = p.success_status === "passed";
      return `<tr>
        <td class="mono">${when(x.received_at)}</td>
        <td>${esc(p.program_id)}</td>
        <td><span class="pill ${passed ? "ok" : p.success_status === "failed" ? "err" : "muted"}">
            ${esc(p.completion_status)}${p.success_status !== "unknown" ? ` · ${esc(p.success_status)}` : ""}</span></td>
        <td>${p.score?.raw != null ? `${p.score.raw}${p.score.max != null ? ` / ${p.score.max}` : ""}` : "—"}</td>
        <td class="mono">${dur(p.total_seconds)}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="5" class="empty">
        Nothing yet. Complete the program on the learner site and the result arrives here.</td></tr>`;
  } catch {}
}

/* ---------------- session ---------------- */
let USER = null;

function showApp() {
  el("gate").innerHTML = "";
  document.querySelector(".topbar").style.display = "";
  view.style.display = "";
  /* The signed-in name is the way into your own profile — where every other
     application of this shape puts it. */
  el("who").innerHTML = `<button class="whoBtn" id="myProfile"
      data-tip="Your profile"><b>${esc(USER.name)}</b><span class="role">${
      esc(USER.role)}</span></button>`;
  el("myProfile").onclick = () => openModal("me", USER);
  startAlerts();
  fetch("/api/subjects").then(r => r.json()).then(d => {
    SUBJECTS = d.subjects || [];
    OFFICERS = d.officers || [];
    route();
  }).catch(() => {
    view.innerHTML = `<div class="err">Couldn't load the subject roster.</div>`;
  });
}

function showSignIn(error) {
  stopPolling();
  stopAlerts();
  document.querySelector(".topbar").style.display = "none";
  view.style.display = "none";
  el("gate").innerHTML = `
    <div class="signin"><div class="card">
      <div class="logo">N</div>
      <h1>Northwood Corrections</h1>
      <div class="sub">Staff sign in</div>
      ${error ? `<div class="err">${esc(error)}</div>` : ""}
      <form id="lf">
        <label for="em">Email</label>
        <input type="email" id="em" autocomplete="username" required
               placeholder="you@northwood.gov">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password" required
               placeholder="••••••••">
        <button class="btn" id="go" type="submit">Sign in</button>
      </form>
      <div class="note">Subjects do not sign in here.<br>
        They use the learner app.</div>
    </div></div>`;

  el("lf").onsubmit = async e => {
    e.preventDefault();
    const btn = el("go"); btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const r = await fetch("/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: el("em").value.trim(), password: el("pw").value })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Sign in failed");
      USER = d.user;
      showApp();
    } catch (err) {
      showSignIn(String(err.message || err));
    }
  };
}

el("signout").onclick = async () => {
  await fetch("/auth/logout", { method: "POST" });
  USER = null; location.hash = ""; showSignIn();
};

/* The cookie is httpOnly, so the page cannot read it — ask the server
   whether it is still valid. */
fetch("/auth/me").then(r => r.ok ? r.json() : null).then(d => {
  if (d?.user) { USER = d.user; showApp(); } else showSignIn();
}).catch(() => showSignIn("Couldn't reach the server."));
</script>
</body>
