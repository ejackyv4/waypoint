<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — My Learning</title>
<style>
:root{
  --brand:#2563eb; --brand-dark:#1d4ed8; --brand-soft:#eff6ff;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --bg:#eef2f6; --surface:#fff;
  --ok:#059669; --ok-soft:#ecfdf5; --err:#dc2626; --err-soft:#fef2f2;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#f1f5f9; --ink-2:#cbd5e1; --muted:#94a3b8; --faint:#64748b;
  --line:#1e293b; --bg:#0b1120; --surface:#0f172a; --brand-soft:#1e293b;
  --ok-soft:#052e23; --err-soft:#2b0f0f; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

.topbar{background:var(--surface);border-bottom:1px solid var(--line);
        padding:0 24px;height:68px;display:flex;align-items:center;gap:12px}
.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;
      background:linear-gradient(135deg,var(--brand),#60a5fa)}
.wordmark{font-weight:650;font-size:17px;letter-spacing:-.01em}
.who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted)}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}

.wrap{max-width:760px;margin:0 auto;padding:24px 24px 70px}

/* condensed case profile */
.profbar{background:var(--surface);border-bottom:1px solid var(--line);
         padding:16px 24px;display:flex;align-items:center;gap:15px}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 auto;
        font-weight:700;width:52px;height:52px;font-size:18px;user-select:none}
.profbar .nm{font-size:19px;font-weight:700;letter-spacing:-.3px}
.profbar .mt{font-size:13.5px;color:var(--muted);margin-top:1px}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;
      padding:0 24px;max-width:100%;overflow-x:auto}
.tab{background:none;border:0;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
     color:var(--muted);padding:14px 4px;margin-right:26px;display:flex;align-items:center;gap:8px;
     border-bottom:2px solid transparent}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--err);color:#fff;
       font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px}

.visitcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
           padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.visitcard .top{display:flex;gap:12px;align-items:flex-start}
.visitcard h3{margin:0;flex:1;font-size:17px;letter-spacing:-.2px}
.visitcard .note{margin-top:10px;padding:11px 13px;background:var(--bg);border-radius:9px;
                 font-size:14px;color:var(--ink-2);line-height:1.5}

/* ---- sign in ---- */
.signin{max-width:390px;margin:8vh auto;padding:0 20px;text-align:center}
.signin .mark{width:56px;height:56px;border-radius:16px;margin:0 auto 16px}
.signin h1{font-size:26px;margin:0 0 26px;letter-spacing:-.5px}
.field{text-align:left;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;
      font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
input:focus{outline:2px solid var(--brand);outline-offset:-1px}
button.primary{appearance:none;border:0;cursor:pointer;font:inherit;font-size:16px;font-weight:650;
       width:100%;padding:15px;border-radius:12px;background:var(--brand);color:#fff;margin-top:12px}
button.primary:hover{background:var(--brand-dark)}
button.primary:disabled{opacity:.55;cursor:default}
.error{background:var(--err-soft);color:var(--err);border:1px solid #fecaca;
       border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px;text-align:left;font-weight:600}

/* ---- program cards ---- */
h2.pagetitle{font-size:21px;letter-spacing:-.3px;margin:0 0 3px}
p.pagesub{color:var(--muted);margin:0 0 22px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
      padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.cardtop{display:flex;gap:12px;align-items:flex-start}
.cardtop h3{margin:0;flex:1;font-size:18px;letter-spacing:-.2px}
.meta{color:var(--muted);font-size:13.5px;margin-top:6px}
.pill{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.err{background:var(--err-soft);color:var(--err)}
.badge.calm{background:var(--brand,#2563eb)}
.actRow{display:flex;gap:14px;align-items:center;justify-content:space-between}
.actBody{font-size:15px;line-height:1.45}
.actMeta{font-size:12.5px;color:var(--muted);margin-top:4px}
.actMeta.late{color:var(--err);font-weight:650}
.pill.go{background:var(--brand-soft);color:var(--brand)}
.pill.muted{background:var(--bg);color:var(--muted)}
.cta{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:11px;
     background:var(--brand);color:#fff;font:inherit;font-size:15.5px;font-weight:650;cursor:pointer}
.cta:hover{background:var(--brand-dark)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.bigtime{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-top:10px;color:var(--ink)}
.srow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow > div:first-child{flex:1;min-width:0}
.srow-t{font-weight:650;font-size:15px}
.muted-link{color:var(--muted);margin-left:14px}
.carform{border-top:1px solid var(--line);margin-top:12px;padding-top:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.carform label{margin-top:10px}
.ackbar{display:flex;align-items:center;gap:16px;background:var(--brand-soft);
        border-color:var(--brand);flex-wrap:wrap}
.ackbar > div{flex:1;min-width:200px}
.condrow{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.6;font-size:14.5px}
.condrow:last-child{border-bottom:0}
.tracked{margin-top:7px;font-size:13px;color:var(--brand);background:var(--brand-soft);
         display:inline-block;padding:4px 10px;border-radius:8px}

/* ---- supervision agreement ---- */
.agdoc{background:var(--surface);border:1px solid var(--line);border-radius:14px;
       box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.agdoc .head{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.agdoc .head h2{margin:0;font-size:20px;letter-spacing:-.3px}
.agdoc .head .office{color:var(--muted);font-size:13.5px;margin-top:3px}
.agfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
         gap:2px 20px;padding:16px 22px;background:var(--bg)}
.agfacts dt{font-size:11.5px;font-weight:700;color:var(--muted);
            text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.agfacts dd{margin:2px 0 0;font-size:15px;font-weight:600}
.agsec{padding:6px 22px 18px}
.agsec h3{font-size:13px;font-weight:800;color:var(--brand);text-transform:uppercase;
          letter-spacing:.06em;margin:22px 0 2px}
.condrow{display:flex;gap:12px;align-items:baseline}
.condrow .n{color:var(--faint);font-variant-numeric:tabular-nums;font-weight:700;
            font-size:13.5px;min-width:22px}
.violbox{margin:8px 22px 22px;padding:16px 18px;background:var(--err-soft);
         border:1px solid #fecaca;border-radius:11px;font-size:14.5px;line-height:1.6}
.violbox b{display:block;color:var(--err);font-size:12.5px;text-transform:uppercase;
           letter-spacing:.05em;margin-bottom:6px}

.ackpanel{padding:20px 22px 22px;border-top:1px solid var(--line);background:var(--bg)}
.ackpanel h3{margin:0 0 8px;font-size:16px}
.ackpanel p{margin:0 0 14px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.ackcheck{display:flex;gap:12px;align-items:flex-start;cursor:pointer;
          padding:14px;background:var(--surface);border:1px solid var(--line);
          border-radius:11px;font-size:14.5px;line-height:1.5}
.ackcheck input{width:20px;height:20px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--brand)}
.ackdone{display:flex;gap:12px;align-items:center;padding:16px 18px;background:var(--ok-soft);
         border:1px solid #a7f3d0;border-radius:11px;color:var(--ok);font-weight:650;font-size:14.5px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:15px 17px;border-radius:12px;
        margin-bottom:16px;font-size:14.5px;line-height:1.55;font-weight:600}
.notice.warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}

/* The one way this site says something worked. The console and the app both
   have a toast; this had nothing, so every save here looked identical to doing
   nothing. One idiom across all three clients, not three. */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
       background:var(--ok);color:#fff;font-size:14px;font-weight:600;
       padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);
       opacity:0;transition:opacity .18s ease,transform .18s ease;z-index:60;
       max-width:88vw;text-align:center}
#toast.err{background:var(--err)}
#toast.in{opacity:1;transform:translate(-50%,0)}
.notice.warn a,.notice.warn button{color:#b45309}
.notice .ico{font-size:17px;line-height:1.2}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;
       background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:11px;
       font-size:14.5px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.25);
       transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;text-align:center}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--err);color:#fff}
.inline-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{appearance:none;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--brand);font:inherit;font-weight:650;padding:9px 13px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--err)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.formgrid .field{margin-bottom:0}
.modalback{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.46);display:flex;align-items:center;justify-content:center;padding:20px}
.modalcard{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(15,23,42,.28)}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:16px}
.modalhead h3{margin:0;font-size:20px}
.modalclose{border:0;background:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;padding:2px 6px}
select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
@media(max-width:560px){.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* The learner site. Signs in against Waypoint, lists what this person has
   been assigned, and opens the player with a short-lived launch ticket.
   The session token here is person-scoped: it can list and it can request
   tickets. It cannot write to a registration. */
const API = "";                                  // same origin as this page
const SAAS = "__SAAS_ORIGIN__";                  // Northwood's own system
const app = document.getElementById("app");
/** Say that something worked, or did not. Named `toast` because that is what
 *  the console and the app call it — one word for one idea, across all three. */
function toast(msg, kind = "ok") {
  document.getElementById("toast")?.remove();
  const t = document.createElement("div");
  t.id = "toast"; t.className = kind === "err" ? "err" : "";
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("in"));
  setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 220); }, 2400);
}

const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
const dur = s => { s = Math.max(0, Math.round(+s || 0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s%60}s` : `${s}s`; };
const money = cents => `$${(Math.max(0, Number(cents) || 0) / 100).toFixed(2)}`;

/* The mobile app opens on its attention summary. Start here too; My Learning
   remains a dedicated tab rather than a second place for alerts. */
let auth = null, caseData = null, tab = "home";

/* No browser dialogs — one notification, used everywhere. */
function toast(msg, kind = "ok") {
  document.getElementById("toast")?.remove();
  const t = document.createElement("div");
  t.id = "toast"; t.className = `toast ${kind}`; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("in"));
  setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 250); }, 3200);
}

/* Does the subject owe an acknowledgment right now? Two ways to owe one:
   never given, or withdrawn because the conditions were amended. */
const needsAck = () => !!(caseData?.agreement && !caseData.agreement.subject_signed_at);
const wasAmended = () => !!(caseData?.agreement?.amended_at && needsAck());
try { auth = JSON.parse(sessionStorage.getItem("wp.auth") || "null"); } catch {}

/* Deterministic color per person, matching the mobile app. */
function avatarHtml(name) {
  const initials = String(name || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  let h = 0; for (const c of String(name || "")) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<div class="avatar" style="background:hsl(${h} 42% 42%)" aria-hidden="true">${esc(initials)}</div>`;
}

/* Stored 24-hour, shown 12-hour. */
function to12h(hhmm) {
  if (!hhmm) return "";
  const [h, m] = String(hhmm).split(":").map(Number);
  if (Number.isNaN(h)) return hhmm;
  return `${h % 12 === 0 ? 12 : h % 12}:${String(m ?? 0).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`;
}
const CS_LABEL = { todo: "To do", in_progress: "In progress", complete: "Complete" };
const TRAVEL_LABEL = { none: "None", local: "Local only",
                       interstate: "Interstate", international: "International" };
const asDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined,
  { month:"numeric", day:"numeric", year:"numeric" }) : "";
const stampDate = t => t ? new Date(t).toLocaleDateString(undefined,
  { month:"long", day:"numeric", year:"numeric" }) : "";
const stampFull = t => t ? new Date(t).toLocaleString(undefined,
  { month:"long", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" }) : "";
const isExpired = t => !!(t?.expires_on && new Date(t.expires_on + "T23:59:59") < new Date());
const CS_CLASS = { todo: "muted", in_progress: "go", complete: "ok" };

const fmtVisit = t => t ? new Date(t).toLocaleString(undefined,
  { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) : "—";

/* Northwood's case data, fetched with the Waypoint token. Their side asks
   Waypoint who the token belongs to rather than trusting this page. */
async function loadCase(markSeen) {
  try {
    const r = await fetch(`${SAAS}/api/me/case${markSeen ? "?seen=1" : ""}`,
      { headers: { Authorization: `Bearer ${auth.token}` } });
    caseData = r.ok ? await r.json() : null;
  } catch { caseData = null; }
}

const save = a => { auth = a;
  try { a ? sessionStorage.setItem("wp.auth", JSON.stringify(a))
          : sessionStorage.removeItem("wp.auth"); } catch {} };

function signInView(error) {
  app.innerHTML = `
    <div class="signin">
      <div class="mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l19-9-9 19-2-8-8-2z"/></svg></div>
      <h1>Meridian</h1>
      ${error ? `<div class="error">${esc(error)}</div>` : ""}
      <form id="f">
        <div class="field"><label for="u">Email</label>
          <input id="u" type="email" autocomplete="username" placeholder="you@example.com" required></div>
        <div class="field"><label for="p">Password</label>
          <input id="p" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        <button class="primary" id="go" type="submit">Sign in</button>
      </form>
    </div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById("go");
    btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const r = await fetch(`${API}/api/auth/login`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier: document.getElementById("u").value.trim(),
                               password: document.getElementById("p").value })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Sign in failed");
      save({ token: d.token, person: d.person });
      listView();
    } catch (err) {
      signInView(String(err.message || err));
    }
  };
}

async function listView() {
  app.innerHTML = `<div class="wrap"><p class="pagesub">Loading…</p></div>`;
  let d;
  try {
    const r = await fetch(`${API}/api/me/assignments`,
      { headers: { Authorization: `Bearer ${auth.token}` } });
    if (r.status === 401) { save(null); return signInView("Your session expired. Please sign in again."); }
    d = await r.json();
  } catch { return signInView("Couldn't reach Meridian."); }

  await loadCase(false);
  if (caseData) caseData.programs = d.programs || [];
  const cards = (d.programs || []).map(p => {
    const done = p.completion_status === "completed";
    const passed = p.success_status === "passed", failed = p.success_status === "failed";
    const started = p.registration_id && p.completion_status !== "not attempted";
    const suspended = p.exit_mode === "suspend";
    return `<div class="card">
      <div class="cardtop">
        <h3>${esc(p.title)}</h3>
        <span class="pill ${done ? "ok" : started ? "go" : "muted"}">
          ${done ? "Completed" : started ? "In progress" : "Not started"}</span>
      </div>
      <div class="meta">SCORM ${esc(p.scorm_version)}${p.attempt ? ` · Attempt ${p.attempt}` : ""}${
        p.score_raw != null ? ` · Score ${p.score_raw}${p.score_max ? `/${p.score_max}` : ""}` : ""}${
        p.total_seconds ? ` · ${dur(p.total_seconds)}` : ""}</div>
      ${(passed || failed) ? `<div class="meta" style="color:${passed ? "var(--ok)" : "var(--err)"};font-weight:650">
          ${passed ? "Passed" : "Not passed"}</div>` : ""}
      <button class="cta" data-program="${esc(p.program_id)}">
        ${done ? "Retake course" : suspended ? "Resume course"
          : started ? "Continue" : "Start course"}</button>
    </div>`;
  }).join("");

  PROGRAM_CARDS = cards;
  paint();
}

/* One shell, two views. The tab strip only appears once there is somewhere
   else to go — a lone tab is chrome for its own sake. */
let PROGRAM_CARDS = "";
function paint() {
  const who = auth.person?.name || auth.person?.subject_id || "";
  const subject = caseData?.subject;
  const hasAgreement = !!caseData?.agreement;
  app.innerHTML = `
    <header class="topbar">
      <span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l19-9-9 19-2-8-8-2z"/></svg></span>
      <span class="wordmark">Meridian</span>
      <span class="who">${esc(who)}<button class="link" id="out">Sign out</button></span>
    </header>
    ${subject ? `
      <div class="profbar">
        ${avatarHtml(subject.name)}
        <div>
          <div class="nm">${esc(subject.name)}</div>
          <div class="mt">${esc(subject.case_number || "")}${
            subject.officer ? ` &middot; Officer ${esc(subject.officer)}` : ""}</div>
        </div>
      </div>` : ""}
      <nav class="tabs">
        <button class="tab ${tab === "home" ? "on" : ""}" data-tab="home">Home</button>
        <button class="tab ${tab === "programs" ? "on" : ""}" data-tab="programs">My Learning</button>
        <button class="tab ${tab === "actions" ? "on" : ""}" data-tab="actions">
          What I agreed to${myActions().length
            ? `<span class="badge${myActions().some(overdueAction) ? "" : " calm"}">${
                myActions().length}</span>` : ""}</button>
        ${hasAgreement ? `<button class="tab ${tab === "agreement" ? "on" : ""}" data-tab="agreement">Supervision agreement${needsAck() ? `<span class="badge">1</span>` : ""}</button>` : ""}
        <button class="tab ${tab === "visits" ? "on" : ""}" data-tab="visits">Visits</button>
        <button class="tab ${tab === "me" ? "on" : ""}" data-tab="me">Me</button>
      </nav>
    <div class="wrap" id="wrap"></div>`;

  document.getElementById("out").onclick = () => { save(null); signInView(); };
  app.querySelectorAll("[data-tab]").forEach(b =>
    b.onclick = () => { tab = b.dataset.tab; paint(); scrollTo(0, 0); });

  if (tab === "agreement") return paintAgreement();
  if (tab === "actions")   return paintActions();
  if (tab === "home")      return paintHome();
  if (tab === "visits")    return paintVisits();
  if (tab === "me")        return paintMe();

  document.getElementById("wrap").innerHTML = `<h2 class="pagetitle">My Learning</h2>
    <p class="pagesub">Programs assigned to you.</p>
    ${PROGRAM_CARDS || `<div class="card empty">Nothing assigned yet.</div>`}`;
  app.querySelectorAll("[data-program]").forEach(b => b.onclick = () => launch(b));
}

function paintHome() {
  const programs = caseData?.programs || [];
  const visits = caseData?.visits || [];
  const actions = myActions();
  const agreement = caseData?.agreement;
  const reentry = caseData?.reentry;
  const dates = caseData?.important_dates || [];
  const financial = caseData?.financial?.totals || {};
  const goals = caseData?.goals || [];
  const startedPrograms = programs.filter(p => p.registration_id && p.completion_status !== "not attempted");
  const untouchedPrograms = programs.filter(p => !p.registration_id || p.completion_status === "not attempted");
  const cards = [];
  const add = (title, line, tab, tone = "go", meta = "", cta = "Open") =>
    cards.push({ title, line, tab, tone, meta, cta });
  if (agreement && needsAck())
    add("Conditions of supervision", wasAmended() ? "Updated — read and acknowledge again" : "Read and acknowledge them", "agreement", "err", "", "Review");
  const awaiting = reentry?.readiness?.awaiting_signature || 0;
  if (reentry && awaiting)
    add("Reentry plan", `${awaiting} checkpoint${awaiting === 1 ? "" : "s"} need${awaiting === 1 ? "s" : ""} your signature`, "me", "err", reentry.readiness?.percent != null ? `${reentry.readiness.percent}% ready` : "", "Sign");
  if (actions.length)
    add("What you agreed to", `${actions.length} thing${actions.length === 1 ? "" : "s"} to do`, "actions", actions.some(overdueAction) ? "err" : "go", "", "Open");
  const scheduledVisits = visits.filter(v => v.status === "scheduled");
  const unconfirmedVisits = scheduledVisits.filter(v => !v.subject_confirmed_at).length;
  if (scheduledVisits.length)
    add("Visits", unconfirmedVisits ? `${unconfirmedVisits} appointment${unconfirmedVisits === 1 ? "" : "s"} need${unconfirmedVisits === 1 ? "s" : ""} confirming` : `Next on ${fmtVisit(scheduledVisits[0].scheduled_at)}`, "visits", unconfirmedVisits ? "go" : "go", "", unconfirmedVisits ? "Confirm" : "See all");
  const toConfirm = dates.filter(d => d.state === "assigned" || d.state === "viewed").length;
  const toReport = dates.filter(d => d.awaiting_outcome).length;
  if (toConfirm || toReport)
    add("Appointments", toConfirm ? `${toConfirm} to confirm` : `${toReport} with no outcome reported`, "me", toReport ? "err" : "go", toConfirm && toReport ? `${toReport} need reporting` : "", "Open");
  if (financial.balance_cents > 0)
    add("What you owe", financial.overdue_cents > 0 ? `${money(financial.overdue_cents)} overdue` : `${money(financial.balance_cents)} outstanding`, "me", financial.overdue_cents > 0 ? "err" : "go", "", "Open");
  const openGoals = goals.filter(g => g.status === "open").length;
  if (openGoals)
    add("Goals", `${openGoals} being worked on`, "actions", "go", "", "Open");
  if (startedPrograms.length)
    add("Programs", `${startedPrograms.length} course${startedPrograms.length === 1 ? "" : "s"} in progress`, "programs", "go", "", "Open");
  else if (untouchedPrograms.length)
    add("Programs", `${untouchedPrograms.length} course${untouchedPrograms.length === 1 ? "" : "s"} not started`, "programs", "err", "", "Open");
  document.getElementById("wrap").innerHTML = `<h2 class="pagetitle">Home</h2><p class="pagesub">What needs your attention.</p>`
    + (cards.length ? cards.map(c => `<button class="card" data-home-tab="${c.tab}" style="text-align:left;width:100%;cursor:pointer"><div class="cardtop"><h3>${esc(c.title)}</h3><span class="pill ${c.tone}">${esc(c.cta)}</span></div><div class="meta">${esc(c.line)}</div>${c.meta ? `<div class="meta">${esc(c.meta)}</div>` : ""}</button>`).join("") : `<div class="card empty">Nothing outstanding.</div>`);
  document.querySelectorAll("[data-home-tab]").forEach(b => b.onclick = () => { tab = b.dataset.homeTab; paint(); scrollTo(0, 0); });
}

function paintVisits() {
  const visits = (caseData?.visits || []).filter(v => v.status !== "cancelled");
  document.getElementById("wrap").innerHTML = `<h2 class="pagetitle">Visits</h2><p class="pagesub">Appointments and visits connected to your supervision.</p>`
    + (visits.length ? visits.map(v => `<div class="visitcard"><div class="top"><h3>${esc(fmtVisit(v.scheduled_at) || "Visit")}</h3><span class="pill ${v.status === "completed" ? "ok" : v.status === "scheduled" ? "go" : "muted"}">${esc(v.status || "scheduled")}</span></div><div class="meta">${esc(v.location || "Location to be confirmed")}</div>${v.note ? `<div class="note">${esc(v.note)}</div>` : ""}${v.status === "scheduled" && !v.subject_confirmed_at ? `<button class="cta" data-visit-accept="${v.id}">Confirm this visit</button>` : ""}</div>`).join("") : `<div class="card empty">No visits scheduled.</div>`);
  document.querySelectorAll("[data-visit-accept]").forEach(b => b.onclick = async () => { b.disabled = true; try { const r = await fetch(`${SAAS}/api/me/visits/accept`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${auth.token}` }, body: JSON.stringify({ id: +b.dataset.visitAccept }) }); if (!r.ok) throw new Error("Could not confirm visit"); await loadCase(); paint(); toast("Visit confirmed"); } catch (e) { b.disabled = false; toast(e.message, "err"); } });
}

n></div><div class="meta">${needsAck() ? "Review and acknowledge your conditions." : "You acknowledged these conditions."}</div></button>` : ""}`;
  const post = async (path, body, message, editor = null) => { try { const r = await fetch(`${SAAS}${path}`, { method:"POST", headers:{"Content-Type":"application/json",Authorization:`Bearer ${auth.token}`}, body:JSON.stringify(body) }); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error || "Could not save"); editor?.remove(); await loadCase(false); paint(); toast(message); } catch(e) { toast(e.message,"err"); } };
  const openEditor = (kind, values, fields) => { document.querySelector(`[data-editor="${kind}"]`)?.remove(); document.body.insertAdjacentHTML("beforeend", form(kind, values, fields)); const editor=document.querySelector(`[data-editor="${kind}"]`); const close=()=>editor?.remove(); editor.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=close); editor.onclick=e=>{if(e.target===editor)close();}; editor.querySelector("[data-make-select]")?.addEventListener("change", e=>{ const custom=e.target.value === "Other", input=editor.querySelector("[data-make-other]"); e.target.toggleAttribute("data-edit", !custom); input.toggleAttribute("data-edit", custom); input.style.display=custom ? "block" : "none"; if(custom){ input.value=""; input.focus(); } }); const empStatus=editor.querySelector("[data-employment-status]"); empStatus?.addEventListener("change",()=>{ editor.querySelector("[data-employment-details]").style.display=empStatus.value === "employed" ? "contents" : "none"; }); editor.querySelector("[data-save]").onclick=()=>{ const body={}; if(values.id) body.id=values.id; editor.querySelectorAll("[data-edit]").forEach(i=>body[i.dataset.edit]=i.value.trim()); post(`/api/me/${kind === "vehicle" ? "vehicles" : kind === "employment" ? "employment" : "contacts"}`,body,kind === "vehicle" ? (values.id ? "Vehicle updated" : "Vehicle added") : kind === "contact" ? (values.id ? "Contact updated" : "Contact added") : "Employment updated",editor); }; editor.querySelector("input")?.focus(); };
  const openProfile = () => { document.querySelector('[data-editor="profile"]')?.remove(); document.body.insertAdjacentHTML("beforeend", profileForm(s)); const editor=document.querySelector('[data-editor="profile"]'); const close=()=>editor?.remove(); editor.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=close); editor.onclick=e=>{if(e.target===editor)close();}; editor.querySelector("[data-save]").onclick=()=>{const body={}; editor.querySelectorAll("[data-edit]").forEach(i=>body[i.dataset.edit]=i.value.trim()); post("/api/me/profile",body,"Contact details updated",editor);}; editor.querySelector("input")?.focus(); };
  const openDate = () => { document.querySelector('[data-editor="important-date"]')?.remove(); document.body.insertAdjacentHTML("beforeend", dateForm()); const editor=document.querySelector('[data-editor="important-date"]'); const close=()=>editor?.remove(); editor.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=close); editor.onclick=e=>{if(e.target===editor)close();}; const dt=new Date(Date.now()+7*864e5); dt.setHours(9,0,0,0); editor.querySelector('[data-date-edit="scheduled_at"]').value=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16); editor.querySelector("[data-save]").onclick=()=>{const body={}; editor.querySelectorAll("[data-date-edit]").forEach(i=>body[i.dataset.dateEdit]=i.value.trim()); if(!body.scheduled_at)return toast("Pick a date and time.","err"); body.scheduled_at=new Date(body.scheduled_at).toISOString(); post("/api/me/important-dates",body,"Appointment added",editor);}; editor.querySelector("input")?.focus(); };
  document.querySelector("[data-edit-profile]")?.addEventListener("click",openProfile);
  document.querySelector("[data-add-date]")?.addEventListener("click",openDate);
  document.querySelector("[data-add-vehicle]")?.addEventListener("click",()=>openEditor("vehicle",{},field("Year","year")+makeField()+field("Model","model")+field("Color","color")+field("Plate","plate")+field("State","state")));
  document.querySelectorAll("[data-edit-vehicle]").forEach(b=>b.onclick=()=>{const v=cars.find(x=>x.id===Number(b.dataset.editVehicle)); openEditor("vehicle",v,field("Year","year",v.year)+makeField(v.make)+field("Model","model",v.model)+field("Color","color",v.color)+field("Plate","plate",v.plate)+field("State","state",v.state));});
  document.querySelector("[data-edit-employment]")?.addEventListener("click",()=>openEditor("employment",emp,employmentFields(emp)));
  document.querySelector("[data-add-contact]")?.addEventListener("click",()=>openEditor("contact",{},contactFields({})));
  document.querySelectorAll("[data-edit-contact]").forEach(b=>b.onclick=()=>{const c=contacts.find(x=>x.id===Number(b.dataset.editContact)); openEditor("contact",c,contactFields(c));});
  document.querySelectorAll("[data-remove-vehicle]").forEach(b=>b.onclick=()=>{ const v=cars.find(x=>x.id===Number(b.dataset.removeVehicle)); if(window.confirm(`Remove ${[v?.year,v?.make,v?.model].filter(Boolean).join(" ") || "this vehicle"}?`)) post("/api/me/vehicles/delete",{id:Number(b.dataset.removeVehicle)},"Vehicle removed"); });
  document.querySelectorAll("[data-remove-contact]").forEach(b=>b.onclick=()=>{ const c=contacts.find(x=>x.id===Number(b.dataset.removeContact)); if(window.confirm(`Remove ${c?.name || "this contact"}?`)) post("/api/me/contacts/delete",{id:Number(b.dataset.removeContact)},"Contact removed"); });
  document.querySelectorAll("[data-date-action]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    const action = b.dataset.dateAction;
    const path = action === "acknowledge" ? "/api/me/important-dates/acknowledge" : "/api/me/important-dates/close";
    const body = action === "acknowledge" ? { id: Number(b.dataset.dateId) } : { id: Number(b.dataset.dateId), status: action };
    try {
      const r = await fetch(`${SAAS}${path}`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${auth.token}` }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Could not update that appointment");
      await loadCase(false); paint(); toast(action === "acknowledge" ? "Confirmed — your officer can see it" : action === "completed" ? "Recorded as attended" : "Recorded as missed");
    } catch (e) { b.disabled = false; toast(String(e.message || e), "err"); }
  });
  document.querySelectorAll("[data-home-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.homeTab;paint();});
}

/* ---------------- what I agreed to ----------------

   The commitments a subject made out loud at a visit, in their own words.

   This exists on the web because the phone is not the only way somebody reaches
   this. A person on supervision may have a library computer and a phone that is
   out of credit, and a list of what they owe that only one of those can show is
   a list that fails the person most likely to need it.

   Reporting, not deciding: they say they have done it and the record says who
   said so. A list only the officer can close is a list the subject is merely
   watched against. */
const myActions = () => (caseData?.actions || []);
const overdueAction = a =>
  !!a.due_date && a.due_date < new Date().toISOString().slice(0, 10);

async function reportActionDone(id, btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const r = await fetch(`${SAAS}/api/me/actions/done`, {
      method: "POST",
      headers: { "Content-Type": "application/json",
                 Authorization: `Bearer ${auth.token}` },
      body: JSON.stringify({ id })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Couldn't update that");
    toast("Reported as done");
    await loadCase();
    paint();
  } catch (e) {
    toast(String(e.message || e), "err");
    btn.disabled = false; btn.textContent = label;
  }
}

function paintActions() {
  const list = myActions();
  const goals = caseData?.goals || [];
  /* Opening this tab is what marks them seen — the same rule as the app, so a
     subject who reads them on a library computer does not get chased again on
     their phone. Fire and forget: the banner clearing is not worth blocking
     the page for, and the next load will reflect it. */
  if (caseData?.unseen_actions) {
    fetch(`${SAAS}/api/me/case?actions_seen=1`,
          { headers: { Authorization: `Bearer ${auth.token}` } })
      .then(() => { if (caseData) caseData.unseen_actions = 0; })
      .catch(() => {});
  }
  document.getElementById("wrap").innerHTML = `
    <h2 class="pagetitle">What I agreed to</h2>
    <p class="pagesub">Things you committed to at a visit. Tick one off once you
      have done it &mdash; your officer sees that you reported it.</p>

    ${goals.length ? `<h3>Goals</h3>${goals.map(g => `<div class="card"><div class="cardtop"><h3>${esc(g.title)}</h3><span class="pill ${g.status === "complete" ? "ok" : "go"}">${esc(g.status || "open")}</span></div>${g.detail ? `<div class="meta">${esc(g.detail)}</div>` : ""}${g.steps?.length ? g.steps.map(st => `<div class="srow"><div>${esc(st.label || st.title || "Step")}</div><span class="pill ${st.done_at ? "ok" : "muted"}">${st.done_at ? "Done" : "To do"}</span></div>`).join("") : ""}</div>`).join("")}` : ""}

    ${list.length ? list.map(a => `
      <div class="card actRow">
        <div>
          <div class="actBody">${esc(a.body)}</div>
          <div class="actMeta${overdueAction(a) ? " late" : ""}">
            ${a.due_date ? `Due ${esc(a.due_date)}` : "No date set"}
            ${a.due_hint ? ` &middot; you said &ldquo;${esc(a.due_hint)}&rdquo;` : ""}
            ${a.scheduled_at ? ` &middot; from the visit on ${
              esc(a.scheduled_at.slice(0, 10))}` : ""}
          </div>
        </div>
        <button class="btn" data-done="${a.id}">Mark done</button>
      </div>`).join("")
    : `<div class="card empty">Nothing outstanding.</div>`}`;

  app.querySelectorAll("[data-done]").forEach(b =>
    b.onclick = () => reportActionDone(Number(b.dataset.done), b));
}

/* ---------------- supervision agreement ----------------
   The subject reads exactly what the PDF says, grouped the same way, and
   acknowledges it here. Acceptance is deliberate: the button stays disabled
   until they have reached the end of the conditions and ticked the box. */
function paintAgreement() {
  const a = caseData.agreement;
  const subject = caseData.subject || {};
  const cats = caseData.condition_categories || [];
  const signed = !!a.subject_signed_at;

  const byCat = {};
  (a.conditions || []).forEach(c => (byCat[c.category] ||= []).push(c));
  let n = 0;
  const sections = cats.map(([key, label]) => {
    const list = byCat[key] || [];
    if (!list.length) return "";
    return `<h3>${esc(label)}</h3>` + list.map(c => `
      <div class="condrow">
        <span class="n">${++n}.</span>
        <div>${esc(c.body)}
          ${c.obligation_title ? `<div class="tracked">Tracked as ${esc(c.obligation_title)}${
            c.required_quantity ? ` &mdash; ${esc(c.required_quantity)} ${esc(c.unit || "")}` : ""}</div>` : ""}
        </div>
      </div>`).join("");
  }).join("");

  const fact = (label, v) => `<dt>${label}</dt><dd>${esc(v || "\u2014")}</dd>`;

  document.getElementById("wrap").innerHTML = `
    ${!signed ? `
      <div class="notice warn">
        <span class="ico">&#9888;</span>
        <div>${wasAmended()
          ? `These conditions were updated on ${esc(stampDate(a.amended_at))}. Your earlier
             acknowledgment no longer applies &mdash; please read them again.`
          : "Read these conditions in full, then acknowledge them at the bottom of the page."}</div>
      </div>` : ""}

    <div class="agdoc">
      <div class="head">
        <h2>Conditions of Supervision</h2>
        <div class="office">${esc(a.office || "Northwood Corrections")}</div>
      </div>

      <dl class="agfacts">
        ${fact("Subject", subject.name)}
        ${fact("Case number", subject.case_number)}
        ${fact("Supervision type", a.kind)}
        ${fact("Supervision level", a.supervision_level)}
        ${fact("Start date", asDate(a.start_date))}
        ${fact("Expires", asDate(a.end_date))}
        ${fact("Supervising officer", a.officer_name)}
      </dl>

      <div class="agsec">${sections || `<p class="pagesub" style="margin-top:18px">
        No conditions have been recorded.</p>`}</div>

      ${a.violation_text ? `<div class="violbox">
        <b>If you do not comply</b>${esc(a.violation_text)}</div>` : ""}

      <div class="ackpanel" id="ackpanel">
        <h3>Acknowledgment</h3>
        ${signed ? `
          <div class="ackdone">
            <span>&#10003;</span>
            <span>You acknowledged these conditions on ${esc(stampFull(a.subject_signed_at))}.</span>
          </div>` : `
          <p>By acknowledging, you confirm that these conditions have been explained to you,
             that you have read them or had them read to you, and that you understand them.</p>
          <label class="ackcheck">
            <input type="checkbox" id="ackbox" disabled>
            <span id="acklabel">Scroll to the end of the conditions to continue.</span>
          </label>
          <button class="cta" id="ackgo" disabled>Acknowledge these conditions</button>`}
      </div>
    </div>`;

  if (signed) return;

  const box = document.getElementById("ackbox");
  const label = document.getElementById("acklabel");
  const go = document.getElementById("ackgo");
  const panel = document.getElementById("ackpanel");

  // Enable only once the acknowledgment panel itself has been reached — that
  // means the conditions above it have gone past. A promise to have read
  // something you were never shown is worth nothing.
  let reached = false;
  const check = () => {
    if (reached) return;
    if (panel.getBoundingClientRect().top > innerHeight - 60) return;
    reached = true;
    box.disabled = false;
    label.textContent = "I have read and understand these conditions of supervision.";
    removeEventListener("scroll", check);
  };
  addEventListener("scroll", check, { passive: true });
  check();

  box.onchange = () => { go.disabled = !box.checked; };

  go.onclick = async () => {
    go.disabled = true; go.textContent = "Recording\u2026";
    try {
      const r = await fetch(`${SAAS}/api/me/agreement/sign`, {
        method: "POST", headers: { Authorization: `Bearer ${auth.token}` } });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Could not record your acknowledgment");
      caseData.agreement = d.agreement;
      paint();
      toast("Acknowledgment recorded");
    } catch (e) {
      go.disabled = false; go.textContent = "Acknowledge these conditions";
      toast(String(e.message || e), "err");
    }
  };
}

async function launch(btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Opening…";
  try {
    const r = await fetch(`${API}/api/me/launch`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${auth.token}` },
      body: JSON.stringify({ program_id: btn.dataset.program })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    // The player lives on the content origin. Tickets last ~60s, so this
    // must open immediately after being issued.
    /* The player is on the content origin, which may be an IP/port different
       from the learner site. Carry the page that launched it so Done returns
       to this exact learner view instead of guessing from the player API
       origin. */
    const target = new URL(d.launch_url);
    target.searchParams.set("return_to", `${location.origin}/learn`);
    location.href = target.toString();
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    toast(String(e.message || e), "err");
  }
}

auth ? listView() : signInView();
</script>
