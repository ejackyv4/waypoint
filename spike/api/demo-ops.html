<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Operations</title>
<style>body{font:16px system-ui;max-width:720px;margin:48px auto;padding:0 20px;color:#14213d}button,input{font:inherit;padding:10px 14px;border:1px solid #ccd5e3;border-radius:8px}button{cursor:pointer;background:#1565d8;color:white;border:0;margin:6px 6px 6px 0}.danger{background:#bf2020}.hide{display:none}.box{padding:24px;border:1px solid #dbe3ef;border-radius:14px;margin-top:18px}#out{white-space:pre-wrap;background:#f5f7fa;padding:14px;border-radius:8px;min-height:80px}</style>
<h1>Demo Operations</h1>
<section id="login" class="box"><p>Sign in with your demo operator account.</p><input id="email" type="email" value="demo@northwood.gov" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signin">Sign in</button><p id="msg"></p></section>
<section id="ops" class="box hide"><p id="who"></p><p><b>Reset</b> restores the complete saved baseline, including its seeded demo data.</p><button id="reset" class="danger">Reset demo</button><p><b>Clean</b> keeps a subject profile and login but removes that subject’s modules, documents, assignments, attempts, and activity.</p><input id="subject" value="cust-1041"><button id="clean" class="danger">Clean subject</button><button id="status">Refresh status</button><button id="logout">Log out</button><pre id="out"></pre></section>
<script>
const $=id=>document.getElementById(id), api=(p,o={})=>fetch(p,{credentials:'same-origin',...o});
async function me(){const r=await api('/auth/me'); if(r.ok){const d=await r.json();$('login').classList.add('hide');$('ops').classList.remove('hide');$('who').textContent=`Signed in as ${d.user.name} (${d.user.role})`; status();}}
async function signin(){const r=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok){$('msg').textContent=d.error||'Sign-in failed';return;}if(d.must_change){const n=prompt('Set a new password (8+ characters):');if(n){await api('/api/officer/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:$('password').value,password:n})});}} me();}
async function status(){const r=await api('/api/demo-ops/status');$('out').textContent=(await r.json()).output||'Not available';}
async function action(path,body){if(!confirm('This changes demo data. Continue?'))return;const r=await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json();$('out').textContent=d.output||d.error||'Done';}
$('signin').onclick=signin;$('status').onclick=status;$('reset').onclick=()=>action('/api/demo-ops/reset');$('clean').onclick=()=>action('/api/demo-ops/clean',{subject_id:$('subject').value});$('logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};me();
</script>
