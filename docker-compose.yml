services:
  waypoint:
    build: .
    env_file:
      - spike/.env
    environment:
      APP_PORT: 8090
      CONTENT_PORT: 8091
      SAAS_PORT: 8092
      WAYPOINT_BIND_HOST: 0.0.0.0
      WAYPOINT_DATA_DIR: /var/lib/waypoint
      WAYPOINT_APP_INTERNAL_ORIGIN: http://127.0.0.1:8090
      WAYPOINT_APP_ORIGIN: http://app.localhost:18090
      WAYPOINT_CONTENT_ORIGIN: http://content.localhost:18091
      WAYPOINT_SAAS_ORIGIN: http://saas.localhost:18092
    ports:
      - "18090:8090"
      - "18091:8091"
      - "18092:8092"
    volumes:
      - waypoint_docker_data:/var/lib/waypoint

volumes:
  waypoint_docker_data:
